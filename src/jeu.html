    case 'savebox':openSaveBox();break;
    case 'bilanp':R.bilanP=id;renderPanel();break;
    case 'chefhire':{if(S.chef.hired||S.level<CHEF.req)return;if(spend(CHEF.hire,'invest')){S.chef.hired=true;S.chef.since=S.day;toast('🧑‍🍳 La carte est entre de bonnes mains : premier passage ce soir !','gold');confettiBurst(80);renderPanel();}break;}
    case 'cheffire':S.chef.hired=false;toast('Tu reprends la carte en main.');saveSoon();renderPanel();break;
    case 'loan':takeLoan(id);break;
    case 'repay':repayLoan(id);break;
    case 'unlock':{if(S.level<it.lvl)return;if(spend(it.unlock,'invest')){const s=S.items[id];s.unlocked=true;s.stock=Math.max(s.stock,10);toast(`${it.emoji} ${it.name} arrive à la carte !`,'gold');confettiBurst(70);renderPanel();}break;}
    case 'recipe':{const s=S.items[id];if(s.recipe>=3)return;if(spend(recipeCost(it,s.recipe),'invest')){s.recipe++;toast(`${it.emoji} Nouvelle recette ★${s.recipe} : les clients vont adorer !`);renderPanel();}break;}
    case 'hire':{const i=+el.dataset.i;const m=S.candidates[i];if(!m||1+S.staff.length>=maxStations())return;S.candidates.splice(i,1);S.staff.push(m);syncStations();Snd.buy();toast(`👋 ${m.name} rejoint l’équipe !`,'gold');confettiBurst(50);saveSoon();renderPanel();break;}
    case 'fire':{if(R.phase!=='closed')return;S.staff=S.staff.filter(m=>m.name!==id);syncStations();toast(`${id} quitte l’équipe. Bonne continuation !`);saveSoon();renderPanel();break;}
    case 'upg':{const u=UPG[id];const lvl=S.upg[id];if(lvl>=u.costs.length||S.level<u.req[lvl])return;if(spend(u.costs[lvl],'invest')){S.upg[id]++;syncSeats();toast(`${u.icon} ${u.name} : ${u.costs.length>1?`niveau ${S.upg[id]}`:'c’est installé'} !`,'gold');confettiBurst(60);renderPanel();}break;}
    case 'camp':{const c=CAMPAIGNS.find(x=>x.id===id);if(!c||S.campaigns.some(x=>x.id===id))return;if(spend(campCost(c),'invest')){addCampaign({id:c.id,name:c.name,icon:c.icon,traffic:c.traffic,days:c.days});if(c.rep)S.rep=clamp(S.rep+c.rep,1,5);toast(`${c.icon} ${c.name} : c’est parti !`);renderPanel();}break;}
    case 'claim':{const i=+el.dataset.i;const q=QUESTS[i];if(!q||!S.quests.done[i]||S.quests.claimed[i])return;S.quests.claimed[i]=true;S.money+=q.reward;book('recompenses',q.reward);Snd.level();confettiBurst(110);toast(`🎁 +${costTxt(q.reward)} de récompense !`,'gold');saveSoon();renderPanel();break;}
    case 'sound':S.sound=!S.sound;Snd.init();saveSoon();renderPanel();break;
    case 'reset':R.confirmReset=true;renderPanel();break;
    case 'reset-no':R.confirmReset=false;renderPanel();break;
    case 'reset-yes':{try{localStorage.removeItem(SAVE_KEY);}catch(e){}S.sig=[];rebuildItems();S=defaultState();S.candidates=genCandidates(S);rebuildItems();initRuntime();seedFeed();genMissions();tab='carte';renderPanel();updateHud();setSpeedUI();showWelcome();break;}
  }
  R.cat=null;refreshPanel();updateHud();
}
function floatStock(el){const r=el.getBoundingClientRect();void r;toastOnce('stock','📦 Livré !');}
let lastToastKey={};function toastOnce(k,m){const n=performance.now();if(lastToastKey[k]&&n-lastToastKey[k]<1500)return;lastToastKey[k]=n;toast(m);}

/* HUD */
const moneyEl=$('#money');
function updateHud(){
  const bn=S.firm.created?S.firm.name:signName();const bEl=$('#brandName');if(bEl.textContent!==bn)bEl.textContent=bn;
  const fo=fmtK(S.social.followers);const fEl=$('#fol');if(fEl.textContent!==fo)fEl.textContent=fo;
  updateBadge();renderMissions();
  const tc=$('#tierChip');const ti=tierIdx();tc.hidden=ti<1;if(ti>=1){const tx=TIERS[ti].icon+' '+TIERS[ti].name;if(tc.textContent!==tx)tc.textContent=tx;}
  $('#lvlName').textContent=LEVELS[S.level-1].name;$('#lvlNum').textContent=S.level;
  $('#rep').textContent=num1(S.rep);$('#starsFg').style.width=(S.rep/5*100)+'%';
  $('#moneyStat').classList.toggle('neg',S.money<0);
  const cur=LEVELS[S.level-1].xp,nx=LEVELS[S.level]?LEVELS[S.level].xp:null;
  if(nx){$('#xpFill').style.width=clamp((S.xp-cur)/(nx-cur)*100,0,100)+'%';$('#xpTxt').textContent=`${S.xp-cur} / ${nx-cur}`;}else{$('#xpFill').style.width='100%';$('#xpTxt').textContent='MAX';}
  const Wt=WEATHERS[S.weather];const clock=$('#clock');let txt;
  if(R.phase==='open'){const h=hourNow();const hh=Math.floor(h),mm=Math.floor((h-hh)*6)*10;const fe=festivalToday();txt=`🕐 ${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')} · ${weekday().n} · ${fe?fe.icon:seasonOf().icon} ${Wt.icon}`;}
  else if(R.phase==='closing')txt=`🌙 20:00 · Dernières commandes`;
  else txt=`🌙 Demain : ${weekday().n} · ${festivalToday()?festivalToday().icon+' '+festivalToday().name:seasonOf().icon+' '+seasonOf().name} · ${Wt.icon}`;
  if(clock.textContent!==txt)clock.textContent=txt;
  $('#dayFill').style.width=(R.phase==='closed'?0:clamp(R.time/DAY_LEN,0,1)*100)+'%';
  const ob=$('#openBtn');ob.hidden=R.phase!=='closed'||!$('#modal').hidden;const otx=`☀️ Ouvrir le café · Jour ${S.day}`;if(ob.textContent!==otx)ob.textContent=otx;
  const tk=$('#ticker');let th;
  if(R.phase==='closed')th=`<span class="hint">Prépare ta journée : commandes, prix, équipe, réseaux… puis ouvre le café.</span>${S.campaigns.length?S.campaigns.map(c=>`<span class="pill">${c.icon} ${c.name}</span>`).join(''):''}`;
  else{const d=R.day;const avg=d.sats.length?d.sats.reduce((a,b)=>a+b,0)/d.sats.length:null;th=`<span class="pill">😋 ${d.served} servis</span><span class="pill">🚶 ${d.lost} partis</span><span class="pill">💶 ${eur(d.revenue)}</span><span class="pill">⭐ ${avg?num1(avg):'–'} aujourd’hui</span><span class="pill">🧾 file : ${R.queue.length}</span>`;}
  if(tk._h!==th){tk._h=th;tk.innerHTML=th;}
}
function setSpeedUI(){document.querySelectorAll('.speed button').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.speed===R.speed?'true':'false'));}

/* Évènements */
function bindUI(){
  document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{tab=b.dataset.tab;R.confirmReset=false;R.confirmSell=null;R.bkConfirm=null;renderPanel();$('#tabBody').scrollTop=0;}));
  $('#tabBody').addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;Snd.init();act(b.dataset.act,b);});
  $('#tabBody').addEventListener('change',e=>{const t=e.target;if(t.id==='postItem')R.postItem=t.value;
    if(t.id&&t.id.startsWith('chefT-')){S.chef.tasks[t.id.slice(6)]=t.checked;saveSoon();}
    if(t.id==='chefReserve'){S.chef.reserve=+t.value;saveSoon();}if(t.id==='labBase'||t.id==='labTwist'){R[t.id]=t.value;renderPanel();}});
  $('#tabBody').addEventListener('input',e=>{if(e.target.id==='firmName'){R.firmName=e.target.value;return;}if(e.target.id==='frRate'){S.fr.rate=+e.target.value;const v=$('#frRateV');if(v)v.textContent=S.fr.rate+' %';const hh=$('#frRateHint');if(hh)hh.textContent=rateHint();saveSoon();return;}const id=e.target.dataset&&e.target.dataset.price;if(!id)return;S.items[id].price=Math.round(+e.target.value*10)/10;updatePriceUI(id);saveSoon();});
  document.querySelectorAll('.speed button').forEach(b=>b.addEventListener('click',()=>{R.speed=+b.dataset.speed;if(R.speed>0)S.speed=R.speed;setSpeedUI();saveSoon();}));
  $('#openBtn').addEventListener('click',()=>openDay());
  document.addEventListener('click',e=>{const s=e.target.closest&&e.target.closest('[data-suggest]');if(s&&$('#modal').hidden){e.preventDefault();openSuggest();}});
  const goBilan=()=>{tab='bilan';R.bilanP='today';renderPanel();const p=document.querySelector('.panel');if(p&&p.scrollIntoView)p.scrollIntoView({behavior:reduceMotion?'auto':'smooth',block:'start'});};
  $('#moneyStat').addEventListener('click',goBilan);
  $('#moneyStat').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();goBilan();}});
  let taps=[];$('.logo').addEventListener('click',()=>{const n=Date.now();taps=taps.filter(t=>n-t<1600);taps.push(n);if(taps.length>=5&&$('#modal').hidden){taps=[];openCheat();}});
  $('#modal').addEventListener('click',e=>{const ok=e.target.closest('[data-modal-ok]');if(ok){closeModal();const cb=modalOk;modalOk=null;modalChoice=null;if(cb)cb();updateHud();return;}const ch=e.target.closest('[data-choice]');if(ch&&!ch.disabled&&modalChoice)modalChoice(+ch.dataset.choice);});
  cv.addEventListener('pointerdown',e=>{
    Snd.init();const r=cv.getBoundingClientRect();const x=(e.clientX-r.left)/r.width*W,y=(e.clientY-r.top)/r.height*H;
    for(const k of R.coins){if(Math.hypot(k.x-x,k.y-y)<20){collectCoin(k,true);return;}}
    if(R.phase==='closed'||R.speed===0)return;
    for(let i=0;i<R.stations.length;i++){if(Math.abs(x-STATION_X[i])<40&&y>150&&y<STATION_Y+10){if(boost(i))return;}}
    for(const c of R.queue){if(Math.abs(x-c.x)<21&&y>c.y-88&&y<c.y+6){cheer(c);return;}}
  });
  window.addEventListener('beforeunload',save);
  document.addEventListener('visibilitychange',()=>{if(document.hidden)save();});
}

/* Boucle */
let last=0,acc250=0,acc500=0,acc30=0;
function frame(now){
  const rdt=Math.min(.1,Math.max(0,(now-last)/1000));last=now;
  R.t+=rdt;
  if(R.speed>0&&$('#modal').hidden){const sdt=Math.min(rdt,.05);for(let i=0;i<R.speed;i++)update(sdt);}
  updateFx(rdt);
  draw();
  stepConfetti();
  R.dispMoney+=(S.money-R.dispMoney)*Math.min(1,rdt*7);if(Math.abs(S.money-R.dispMoney)<.005)R.dispMoney=S.money;
  const mt=money(R.dispMoney);if(mt!==R.lastMoneyTxt){R.lastMoneyTxt=mt;moneyEl.textContent=mt;}
  acc250+=rdt;if(acc250>.25){acc250=0;updateHud();refreshPanel();}
  acc500+=rdt;if(acc500>.5){acc500=0;checkQuests();checkMissions();checkTrophies();}
  acc30+=rdt;if(acc30>30){acc30=0;save();}
  requestAnimationFrame(frame);
}
function start(data){
  S=(data&&data.S)?mergeState(data.S):load();
  rebuildItems();
  if(S.missions.day!==S.day||!S.missions.list.length)genMissions();
  initRuntime();bindUI();
  if(!S.social.feed.length)seedFeed();
  Cloud.init();mpInit();
  try{document.fonts&&document.fonts.load('20px Pacifico');document.fonts&&document.fonts.load('900 12px Nunito');document.fonts&&document.fonts.load('40px "Lilita One"');}catch(e){}
  renderPanel();updateHud();setSpeedUI();statsPing('start');
  requestAnimationFrame(t=>{last=t;requestAnimationFrame(frame);});
  startupModals();
}
const hot=window.claude&&window.claude.hot;
try{hot&&hot.snapshot&&hot.snapshot(()=>({S}));}catch(e){}
if(hot&&hot.ready)hot.ready(start);else start((hot&&hot.data)||{});
})();
</script>
