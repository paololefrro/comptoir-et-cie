<title>Comptoir & Cie</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@500;700;800;900&family=Pacifico&display=swap">
<style>
/* Mise en page : la salle du café (canvas vivant) à gauche, le carnet de gestion à droite ; empilés sur téléphone.
   Direction : façade de café parisien — murs pistache, boiseries vert bouteille, damier noir et crème, laiton, framboise. */
:root{
  --bg:#e4eedd; --dot:rgba(47,94,69,.10);
  --card:#fbfdf8; --card-2:#eef5e9; --line:#d0dfc4;
  --ink:#2b1d16; --ink-2:#67584d;
  --accent:#e2456b; --accent-2:#b82f51; --on-accent:#ffffff;
  --pist:#3f8f63; --pist-2:#2c6a48; --on-pist:#ffffff; --pist-soft:#d5ebdb;
  --gold:#f0ad3c; --gold-2:#c4831a; --on-gold:#2b1d16; --gold-soft:#fbecce;
  --good:#20804c; --bad:#c43737; --warn:#a9650c;
  --frame:#2f5e45; --focus:#e2456b;
  --shadow:0 14px 30px rgba(35,58,30,.14), 0 2px 6px rgba(35,58,30,.08);
  --font-display:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --font-body:"Nunito","Segoe UI",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121915; --dot:rgba(108,196,147,.07);
    --card:#1c2520; --card-2:#232f28; --line:#33443a;
    --ink:#f3ece1; --ink-2:#bcb0a3;
    --accent:#ff6f90; --accent-2:#c64867; --on-accent:#2a0b15;
    --pist:#62bd8a; --pist-2:#3f8f63; --on-pist:#0d2016; --pist-soft:#20382a;
    --gold:#f2b450; --gold-2:#b4801f; --on-gold:#2b1d16; --gold-soft:#3a301d;
    --good:#66d293; --bad:#ff8080; --warn:#f2b450;
    --frame:#0e2118; --focus:#ff6f90;
    --shadow:0 14px 30px rgba(0,0,0,.45), 0 2px 6px rgba(0,0,0,.3);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121915; --dot:rgba(108,196,147,.07);
  --card:#1c2520; --card-2:#232f28; --line:#33443a;
  --ink:#f3ece1; --ink-2:#bcb0a3;
  --accent:#ff6f90; --accent-2:#c64867; --on-accent:#2a0b15;
  --pist:#62bd8a; --pist-2:#3f8f63; --on-pist:#0d2016; --pist-soft:#20382a;
  --gold:#f2b450; --gold-2:#b4801f; --on-gold:#2b1d16; --gold-soft:#3a301d;
  --good:#66d293; --bad:#ff8080; --warn:#f2b450;
  --frame:#0e2118; --focus:#ff6f90;
  --shadow:0 14px 30px rgba(0,0,0,.45), 0 2px 6px rgba(0,0,0,.3);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background-color:var(--bg);background-image:radial-gradient(circle at 2px 2px,var(--dot) 1.6px,transparent 2px);background-size:24px 24px;color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.4}
button{font-family:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:10px}
h1,h2,h3,h4{font-family:var(--font-display);font-weight:400;margin:0;letter-spacing:.3px;text-wrap:balance}
.app{max-width:1380px;margin:0 auto;padding-block:14px 32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}

/* ---------- HUD ---------- */
.hud{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{width:46px;height:46px;flex:none;border-radius:15px;background:var(--accent);display:grid;place-items:center;font-size:25px;box-shadow:0 4px 0 var(--accent-2)}
.brand h1{font-size:1.75rem;line-height:1.05;color:var(--ink)}
.lvl{font-size:.85rem;color:var(--ink-2);font-weight:800}
.lvl b{color:var(--accent)}
.stats{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.stat{display:flex;align-items:center;gap:8px;background:var(--card);border:2px solid var(--line);border-radius:999px;padding:6px 14px 6px 11px;font-weight:800;font-variant-numeric:tabular-nums;box-shadow:0 2px 0 var(--line)}
.stat b{font-family:var(--font-display);font-weight:400;font-size:1.2rem;letter-spacing:.3px}
.stat.money b{color:var(--good)}
.stat.money.neg b{color:var(--bad)}
.stars{position:relative;display:inline-block;font-size:1rem;line-height:1;letter-spacing:1px}
.stars .s-bg{color:var(--line)}
.stars .s-fg{position:absolute;left:0;top:0;overflow:hidden;white-space:nowrap;color:var(--gold);width:60%}
.xpstat{gap:8px}
.xp-l{font-family:var(--font-display);font-weight:400;color:var(--accent);font-size:.95rem}
.xpbar{width:110px;height:11px;background:var(--card-2);border-radius:99px;overflow:hidden;border:2px solid var(--line)}
.xpbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--accent));transition:width .4s}
.xpstat small{font-size:.78rem;color:var(--ink-2);min-width:58px}

/* ---------- Layout ---------- */
.layout{display:grid;grid-template-columns:minmax(0,1fr) 440px;gap:16px;align-items:start}
@media (max-width:1060px){.layout{grid-template-columns:minmax(0,1fr)}}
.stage-col{display:flex;flex-direction:column;gap:10px;min-width:0}
.stage{position:relative;border-radius:24px;overflow:hidden;box-shadow:var(--shadow);border:4px solid var(--frame);background:#2b1d16;max-width:100%}
.stage canvas{display:block;width:100%;height:auto;aspect-ratio:1000/520;max-width:100%;touch-action:manipulation;cursor:pointer;-webkit-tap-highlight-color:transparent}
.ov-top{position:absolute;left:10px;right:10px;top:10px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;pointer-events:none}
.clock{pointer-events:auto;background:rgba(255,251,243,.94);color:#2b1d16;border-radius:14px;padding:6px 12px 7px;font-weight:900;font-size:.92rem;box-shadow:0 3px 0 rgba(0,0,0,.18);display:flex;flex-direction:column;gap:4px;min-width:150px;font-variant-numeric:tabular-nums}
.daybar{height:5px;background:rgba(43,29,22,.14);border-radius:9px;overflow:hidden}
.daybar i{display:block;height:100%;width:0;background:#e2456b;border-radius:9px}
.speed{pointer-events:auto;display:flex;background:rgba(255,251,243,.94);border-radius:14px;padding:3px;gap:2px;box-shadow:0 3px 0 rgba(0,0,0,.18)}
.speed button{border:0;background:transparent;color:#2b1d16;font-weight:900;font-size:.85rem;padding:6px 9px;border-radius:10px;cursor:pointer;min-width:34px}
.speed button[aria-pressed="true"]{background:#2b1d16;color:#fffaf0}
.toasts{position:absolute;left:50%;top:62px;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:min(92%,560px)}
.toast{background:rgba(30,22,17,.9);color:#fffaf0;padding:8px 14px;border-radius:12px;font-weight:800;font-size:.9rem;text-align:center;box-shadow:0 4px 12px rgba(0,0,0,.25);animation:tin .28s ease-out both}
.toast.gold{background:rgba(240,173,60,.97);color:#2b1d16}
.toast.bad{background:rgba(196,55,55,.95);color:#fff}
.toast.out{animation:tout .35s ease-in forwards}
@keyframes tin{from{opacity:0;transform:translateY(-8px) scale(.96)}to{opacity:1;transform:none}}
@keyframes tout{to{opacity:0;transform:translateY(-6px)}}
.open-btn{position:absolute;left:50%;bottom:7%;transform:translateX(-50%);border:0;cursor:pointer;background:#e2456b;color:#fff;font-family:var(--font-display);font-size:1.45rem;letter-spacing:.5px;padding:14px 26px;border-radius:18px;box-shadow:0 6px 0 #a3284a,0 12px 28px rgba(0,0,0,.35);animation:pulse 1.6s ease-in-out infinite;white-space:nowrap}
.open-btn:active{transform:translateX(-50%) translateY(3px);box-shadow:0 3px 0 #a3284a}
@keyframes pulse{50%{transform:translateX(-50%) scale(1.045)}}
.banner{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;animation:bnr 2.8s ease-out forwards}
.banner .b1{font-family:var(--font-display);font-size:3rem;color:#fff;text-shadow:0 4px 0 #e2456b,0 8px 22px rgba(0,0,0,.45);line-height:1}
.banner .b2{display:inline-block;margin-top:8px;background:#f0ad3c;color:#2b1d16;font-weight:900;padding:6px 14px;border-radius:12px}
@keyframes bnr{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}12%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}20%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-60%)}}
.ticker{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-weight:800;font-size:.9rem;color:var(--ink-2);font-variant-numeric:tabular-nums}
.ticker .pill{background:var(--card);border:2px solid var(--line);border-radius:999px;padding:4px 12px;color:var(--ink)}
.ticker .hint{font-weight:700}
@media (max-width:620px){
  .clock{min-width:0;font-size:.72rem;padding:4px 8px 5px}
  .speed button{font-size:.72rem;padding:4px 6px;min-width:26px}
  .open-btn{font-size:1.05rem;padding:10px 16px;bottom:6%}
  .toasts{top:44px}
  .toast{font-size:.76rem;padding:6px 10px}
  .banner .b1{font-size:2rem}
  .brand h1{font-size:1.4rem}
  .stat{padding:5px 11px 5px 9px}
  .xpbar{width:80px}
}

/* ---------- Panel ---------- */
.panel{background:var(--card);border-radius:24px;box-shadow:var(--shadow);border:2px solid var(--line);display:flex;flex-direction:column;min-width:0;max-height:calc(100vh - 110px);position:sticky;top:12px;overflow:hidden}
@media (max-width:1060px){.panel{max-height:none;position:static}}
.tabs{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px;padding:8px;border-bottom:2px solid var(--line);background:var(--card-2)}
.tab{min-width:0;border:0;background:transparent;font-weight:900;font-size:.76rem;color:var(--ink-2);padding:7px 9px 6px;border-radius:13px;cursor:pointer;position:relative;display:flex;flex-direction:column;align-items:center;gap:1px}
.tab .ti{font-size:1.25rem;line-height:1.1}
.tab[aria-selected="true"]{background:var(--accent);color:var(--on-accent);box-shadow:0 3px 0 var(--accent-2)}
.tab .badge{position:absolute;top:0;right:2px;background:var(--gold);color:var(--on-gold);border-radius:99px;font-size:.7rem;min-width:18px;padding:1px 5px;line-height:1.3;box-shadow:0 2px 0 var(--gold-2)}
.tab-body{overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;min-height:0}
.sec-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.sec-head h3{font-size:1.35rem}
.tab-body h4{font-size:1.05rem;margin-top:6px}
.muted{color:var(--ink-2);margin:0}
.small{font-size:.82rem}
.center{text-align:center}
.hint{margin:0;font-size:.85rem;color:var(--ink-2);background:var(--card-2);border-radius:12px;padding:8px 10px}
.notice{margin:0;font-size:.88rem;background:var(--gold-soft);border:2px dashed var(--gold);border-radius:14px;padding:10px 12px;font-weight:700}
.btn{font-weight:900;font-size:.84rem;border-radius:12px;padding:7px 11px;cursor:pointer;background:var(--card);color:var(--ink);border:2px solid var(--line);box-shadow:0 2px 0 var(--line);transition:transform .08s,filter .12s;white-space:nowrap;line-height:1.2}
.btn:hover:not(:disabled){transform:translateY(-1px);filter:brightness(1.04)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn-primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent-2);box-shadow:0 3px 0 var(--accent-2)}
.btn-green{background:var(--pist);color:var(--on-pist);border-color:var(--pist-2);box-shadow:0 3px 0 var(--pist-2)}
.btn-gold{background:var(--gold);color:var(--on-gold);border-color:var(--gold-2);box-shadow:0 3px 0 var(--gold-2)}
.btn-sm{font-size:.8rem;padding:6px 10px}
.btn-lg{font-size:1rem;padding:11px 16px;border-radius:14px}
.tag{display:inline-flex;align-items:center;gap:3px;font-size:.72rem;font-weight:900;padding:2px 8px;border-radius:99px;background:var(--card);border:1.5px solid var(--line);color:var(--ink-2);white-space:nowrap}
.tag.up{background:var(--pist-soft);border-color:transparent;color:var(--good)}
.tag.down{background:var(--card);color:var(--bad)}
.tag.ok{background:var(--pist-soft);border-color:transparent;color:var(--good)}
.tag.lock{background:var(--card-2)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:.75rem;font-weight:900;padding:2px 8px;border-radius:99px;background:var(--gold-soft);color:var(--ink)}
.item,.upg,.member,.quest{display:flex;gap:11px;padding:11px;border-radius:16px;background:var(--card-2);border:2px solid var(--line);align-items:flex-start}
.item-emo,.upg-ic{flex:none;font-size:28px;width:48px;height:48px;display:grid;place-items:center;background:var(--card);border-radius:14px;border:2px solid var(--line)}
.item-main,.grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.upg .grow,.member .grow,.quest .grow{gap:3px}
.item-top{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.item-top b{font-size:1rem}
.rstars{color:var(--gold);font-size:.85rem;letter-spacing:1px}
.rstars .off{color:var(--line)}
.item.locked .item-emo{filter:grayscale(1);opacity:.55}
.lbl{font-size:.75rem;font-weight:900;color:var(--ink-2);text-transform:uppercase;letter-spacing:.6px;width:42px;flex:none}
.stock-row,.price-row,.verdict-row{display:flex;align-items:center;gap:8px}
.verdict-row{justify-content:space-between;flex-wrap:wrap;gap:4px}
.bar{flex:1;height:10px;border-radius:99px;background:var(--card);border:1.5px solid var(--line);overflow:hidden;min-width:40px}
.bar i{display:block;height:100%;background:var(--pist);border-radius:99px;width:0;transition:width .25s}
.bar i.low{background:var(--accent)}
.num{font-weight:900;font-size:.85rem;font-variant-numeric:tabular-nums;min-width:62px;text-align:right}
.price-row input{flex:1;min-width:60px;accent-color:var(--accent)}
.price-row output{font-family:var(--font-display);font-size:1.1rem;min-width:66px;text-align:right;font-variant-numeric:tabular-nums}
.verdict{font-size:.78rem;font-weight:900;padding:2px 9px;border-radius:99px}
.verdict.great{background:var(--pist-soft);color:var(--good)}
.verdict.ok{background:var(--card);color:var(--ink)}
.verdict.meh{background:var(--gold-soft);color:var(--warn)}
.verdict.bad{background:var(--card);color:var(--bad);border:1.5px solid var(--bad)}
.btns{display:flex;flex-wrap:wrap;gap:6px}
.upg{align-items:center}
.upg.done{opacity:.75}
.pips{display:inline-flex;gap:3px}
.pips i{width:9px;height:9px;border-radius:50%;background:var(--line);display:block}
.pips i.on{background:var(--accent)}
.member{align-items:center}
.member.me{background:var(--pist-soft);border-color:transparent}
.avatar{flex:none;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:#fff;font-family:var(--font-display);font-size:1.2rem;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.charges{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;background:var(--card-2);border-radius:12px;padding:8px 12px;font-size:.85rem}
.charges span{color:var(--ink-2);font-weight:700}
.quest{align-items:center}
.quest.ready{background:var(--gold-soft);border-color:var(--gold)}
.quest .bar{flex:none;width:100%;margin-top:3px}
.quest .bar i{background:var(--gold)}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.statgrid div{background:var(--card-2);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column}
.statgrid b{font-family:var(--font-display);font-weight:400;font-size:1.3rem;font-variant-numeric:tabular-nums}
.statgrid span{font-size:.8rem;color:var(--ink-2);font-weight:700}
.tbreak{display:flex;flex-direction:column;gap:4px;background:var(--card-2);border-radius:14px;padding:10px 12px}
.tbreak div{display:flex;justify-content:space-between;font-size:.86rem;font-variant-numeric:tabular-nums}
.tbreak div b{font-weight:900}
.tbreak .tot{border-top:2px dashed var(--line);padding-top:6px;margin-top:2px}
.camps{display:flex;flex-wrap:wrap;gap:6px}
.settings{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;border-top:2px dashed var(--line);padding-top:12px;margin-top:6px}
.confirm{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-weight:800;font-size:.85rem}

/* ---------- Modal ---------- */
.modal{position:fixed;inset:0;background:rgba(18,13,9,.58);display:grid;place-items:center;z-index:50;padding:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.modal-card{background:var(--card);color:var(--ink);border-radius:26px;max-width:470px;width:100%;max-height:calc(100% - 8px);overflow-y:auto;padding:22px;box-shadow:0 24px 60px rgba(0,0,0,.4);border:3px solid var(--line);display:flex;flex-direction:column;gap:12px;animation:mpop .3s cubic-bezier(.2,1.4,.4,1) both}
@keyframes mpop{from{opacity:0;transform:scale(.9) translateY(10px)}to{opacity:1;transform:none}}
.modal-head{display:flex;gap:12px;align-items:center}
.modal-ic{font-size:34px;width:58px;height:58px;flex:none;border-radius:18px;background:var(--gold-soft);display:grid;place-items:center}
.modal-head h2{font-size:1.6rem;line-height:1.1}
.eyebrow{margin:0;font-size:.75rem;font-weight:900;letter-spacing:1px;text-transform:uppercase;color:var(--accent)}
.big-profit{font-family:var(--font-display);font-size:2.6rem;text-align:center;line-height:1;margin-top:4px;font-variant-numeric:tabular-nums}
.big-profit.pos{color:var(--good)} .big-profit.neg{color:var(--bad)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpis div{background:var(--card-2);border-radius:14px;padding:8px;text-align:center;display:flex;flex-direction:column}
.kpis b{font-family:var(--font-display);font-weight:400;font-size:1.35rem}
.kpis span{font-size:.75rem;color:var(--ink-2);font-weight:700}
.ledger{display:flex;flex-direction:column;gap:3px;background:var(--card-2);border-radius:14px;padding:10px 14px;font-variant-numeric:tabular-nums}
.ledger div{display:flex;justify-content:space-between;font-size:.9rem}
.ledger .pos{color:var(--good)} .ledger .neg{color:var(--bad)}
.ledger .tot{border-top:2px dashed var(--line);margin-top:4px;padding-top:6px;font-weight:900}
.advice{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.advice li{font-size:.88rem;background:var(--card-2);border-radius:12px;padding:7px 10px}
.forecast{background:var(--pist-soft);border-radius:14px;padding:10px 12px;font-size:.9rem}
.ev-text{margin:0;font-size:1rem}
.choices{display:flex;flex-direction:column;gap:8px}
.welcome-list{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.welcome-list li{display:flex;gap:10px;align-items:flex-start;background:var(--card-2);border-radius:14px;padding:9px 12px;font-size:.92rem}
.welcome-list li span{font-size:1.3rem;line-height:1.2}
/* ---------- Extension : réseaux, quartier, groupe ---------- */
.v-pos{color:var(--good)} .v-neg{color:var(--bad)}
.share-bar{display:flex;height:18px;border-radius:99px;overflow:hidden;border:2px solid var(--line);background:var(--card-2)}
.share-bar i{display:block;height:100%}
.share-legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:.8rem;font-weight:700}
.share-legend span{display:inline-flex;align-items:center;gap:5px}
.share-legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.comp,.loc{display:flex;gap:11px;padding:11px;border-radius:16px;background:var(--card-2);border:2px solid var(--line);align-items:flex-start}
.loc.me{background:var(--pist-soft);border-color:transparent;align-items:center}
.comp p,.loc p{margin:0}
.upg.cur{border-color:var(--pist)}
.news{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.news li{font-size:.85rem;background:var(--card-2);border-radius:12px;padding:7px 10px}
.fol-big{text-align:right;display:flex;flex-direction:column;line-height:1}
.fol-big b{font-family:var(--font-display);font-weight:400;font-size:1.8rem;color:var(--accent)}
.fol-big span{font-size:.75rem;color:var(--ink-2);font-weight:800}
.composer .lbl{width:auto}

function genCandidates(st){
  const lvl=st.level||1;const pool=Object.keys(TRAITS).filter(k=>!TRAITS[k].req||lvl>=TRAITS[k].req);
  const used=new Set((st.staff||[]).map(m=>m.name));const out=[];
  for(let i=0;i<3;i++){
    const trait=(i===0&&(st.day||1)<=2)?'novice':pick(pool);
    let name,g=0;do{name=pick(NAMES);g++;}while(used.has(name)&&g<50);used.add(name);
    const T=TRAITS[trait];out.push({name,trait,salary:Math.round(rand(T.sal[0],T.sal[1])),look:staffLook(),days:0,morale:80});
  }
  return out;
}

const Snd={ctx:null,last:{},
  init(){if(this.ctx){if(this.ctx.state==='suspended')this.ctx.resume();return;}try{this.ctx=new(window.AudioContext||window.webkitAudioContext)();}catch(e){this.ctx=null;}},
  tone(f,d,type,v,delay){if(!S||!S.sound||!this.ctx)return;try{const c=this.ctx,t=c.currentTime+(delay||0);const o=c.createOscillator(),g=c.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v||.05,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+d+.03);}catch(e){}},
  ok(k,ms){const n=performance.now();if(this.last[k]&&n-this.last[k]<ms)return false;this.last[k]=n;return true;},
  cash(){if(!this.ok('cash',110))return;this.tone(1318,.09,'triangle',.045);this.tone(1976,.16,'triangle',.04,.06);},

function moveTo(c,tx,ty,dt){
  const dx=tx-c.x,dy=ty-c.y,d=Math.hypot(dx,dy),step=c.spd*dt;
  if(d<=step||d<.5){c.x=tx;c.y=ty;c.walking=false;return true;}
  c.x+=dx/d*step;c.y+=dy/d*step;c.walking=true;if(Math.abs(dx)>2)c.face=Math.sign(dx);return false;
}
function dispatch(){
  for(let i=0;i<R.stations.length&&R.queue.length;i++){
    const st=R.stations[i];
    if(!st.customer){const c=R.queue.shift();st.customer=c;st.prog=0;st.total=0;c.station=i;c.state='toStation';}
  }
}
function leaveAngry(c){

  c.state='leaving';c.mood='angry';c.bubble={e:'😠',t:1.8};
  floatTxt('Trop d’attente !',c.x,c.y-100,RED,13);

function updCustomer(c,dt){
  if(c.cheer>0)c.cheer-=dt;
  if(c.bubble){c.bubble.t-=dt;if(c.bubble.t<=0)c.bubble=null;}
  switch(c.state){
    case 'enter':case 'queue':{
      const i=R.queue.indexOf(c);const p=QUEUE[clamp(i,0,QUEUE.length-1)];
      if(moveTo(c,p[0],p[1],dt))c.state='queue';
      c.pat-=dt;c.wait+=dt;
      if(c.pat<=0)leaveAngry(c);
      break;}
    case 'toStation':
      c.pat-=dt*.7;c.wait+=dt*.7;
      if(moveTo(c,STATION_X[c.station],STATION_Y,dt)){c.state='ordering';c.think=.35;c.face=0;}
      break;
    case 'ordering':c.think-=dt;c.wait+=dt*.3;if(c.think<=0)placeOrder(c);break;
    case 'waiting':c.pat-=dt*.4;c.wait+=dt*.4;break;
    case 'toSeat':if(moveTo(c,c.seat.x,c.seat.y,dt)){c.state='seated';c.face=-c.seat.side;}break;
    case 'toTerrace':if(moveTo(c,DOOR_X,DOOR_Y,dt)){c.state='terrace';R.doorOpen=.5;}break;
    case 'seated':case 'terrace':
      c.sitT-=dt*(R.phase==='closing'?2.5:1);
      if(c.sitT<=0)leaveSeat(c);
      break;
    case 'balk':if(moveTo(c,c.bx,c.by,dt))c.state='leaving';break;
    case 'leaving':if(moveTo(c,DOOR_X,DOOR_Y,dt)){c.gone=true;R.doorOpen=.5;}break;
  }
}
function checkStockWarn(it){

function decideOrder(c){
  const avail=ITEMS.filter(onMenu);if(!avail.length)return {order:[],missed:null,refused:1};
  const T=CTYPES[c.type],Wm=WEATHERS[S.weather].mods;
  const wf=it=>it.pop*(Wm[it.type]||1)*(1+.15*(S.items[it.id].recipe-1))*(T.fav.includes(it.id)?2.2:1)*(it.id===S.social.trend?1.6:1)*(S.social.boost[it.id]||1)*festItemMult(it.id)*(1+[0,0,.05,.1][masteryTier(it.id)]);
  let n=1;const r=Math.random();
  if(c.type==='gourmand')n=r<.35?3:2;else if(c.type==='critique')n=2;else if(r<.28)n=2;
  const order=[],used=new Set();let missed=null,refused=0;
  for(let k=0;k<n;k++){
    const pool=avail.filter(it=>!used.has(it.id));if(!pool.length)break;
    let it=wpick(pool,wf);used.add(it.id);
    if(S.items[it.id].stock<=0){
      if(k===0)missed=it;
      const alt=pool.filter(x=>!used.has(x.id)&&S.items[x.id].stock>0);
      if(!alt.length)continue;
      it=wpick(alt,wf);used.add(it.id);
    }
    const st=S.items[it.id],fair=fairPrice(it,c.budget);
    if(Math.random()>acceptProb(st.price,fair)){if(k===0)refused++;continue;}
    st.stock--;order.push({id:it.id,price:st.price,fair});checkStockWarn(it);
  }
  return {order,missed,refused};
}
function prepTime(order,m){

    if(it.type==='chaud'||it.type==='froid'){p*=Math.pow(.82,S.upg.machine);if(S.mods.slowDrinks)p*=1.4;}
    else p*=Math.pow(.78,S.upg.four);
    t+=p;}
  return t/staffSpeed(m);
}
function placeOrder(c){
  const st=R.stations[c.station];

}
function computeSat(c,m){
  let s=.66,v=0;
  c.order.forEach(o=>v+=clamp((o.fair-o.price)/o.fair,-.4,.4));v/=c.order.length;s+=v*.5;
  s-=clamp(c.wait/c.patMax,0,1.3)*.35;

  s+=S.upg.deco*.025+(S.upg.musique?.03:0)+(S.flags.art?.02:0);
  if(m)s+=TRAITS[m.trait].sat;

}

const fmtK=n=>{n=Math.round(n);const a=Math.abs(n);return a>=1e6?num1(n/1e6)+' M':a>=1e4?Math.round(n/1e3)+' k':a>=1000?num1(n/1e3)+' k':String(n);};

function unitCost(it,express){const m=S.market[it.type]||1;if(express)return it.cost*m*EXPRESS*(S.shortage&&S.shortage.type===it.type?1.4:1);return it.cost*m*SUP[S.supplier].price;}

function orderStock(id,q,silent){
  const it=ITEM[id],s=S.items[id];if(!s.unlocked||blocked(it))return false;
  q=Math.min(q,stockCap()-s.stock-pendingQty(id));if(q<=0)return false;
  const cost=Math.round(q*unitCost(it)*100)/100;if(!spend(cost,'stock'))return false;
  const ex=S.orders.find(o=>o.id===id);if(ex){ex.qty+=q;ex.cost+=cost;}else S.orders.push({id,qty:q,cost});
  if(!silent)toastOnce('order',`🧾 Commande passée : livraison ${deliveryWhen()}.`);
  return true;
}
function orderAllCost(){const cap=stockCap();return ITEMS.reduce((a,it)=>{const s=S.items[it.id];if(!onMenu(it)||blocked(it))return a;return a+Math.max(0,cap-s.stock-pendingQty(it.id))*unitCost(it);},0);}
function orderAll(silent){let n=0;ITEMS.forEach(it=>{if(onMenu(it)&&orderStock(it.id,9999,true))n++;});if(n&&!silent)toast(`🧾 ${n} commande${n>1?'s':''} passée${n>1?'s':''} : livraison ${deliveryWhen()}.`);return n;}
function expressStock(id,q){const it=ITEM[id],s=S.items[id];q=Math.min(q,stockCap()-s.stock);if(q<=0)return false;const cost=Math.round(q*unitCost(it,true)*100)/100;if(!spend(cost,'stock'))return false;s.stock+=q;toast(`🛵 Coursier express : ${q} ${it.emoji} livrés tout de suite !`);return true;}
function cancelOrder(id){if(R.phase!=='closed')return;const i=S.orders.findIndex(o=>o.id===id);if(i<0)return;const o=S.orders[i];S.orders.splice(i,1);S.money+=o.cost;S.ledger.stock-=o.cost;book('stock',o.cost);toast('Commande annulée et remboursée.');saveSoon();}
function applyDelivery(orders,ratio){
  const cap=stockCap();const lines=[];let refund=0;
  orders.forEach(o=>{const it=ITEM[o.id],s=S.items[o.id];const q=Math.round(o.qty*ratio);s.stock=Math.min(cap,s.stock+q);if(q<o.qty)refund+=o.cost*(1-q/o.qty);lines.push(`${q} ${it.emoji}`);});

function perish(){let n=0,val=0;const rate=S.upg.vitrine?.08:.25;ITEMS.forEach(it=>{if(!PERISH[it.type])return;const s=S.items[it.id];if(!s.unlocked||s.stock<=0)return;const l=Math.floor(s.stock*rate);if(l>0){s.stock-=l;n+=l;val+=l*it.cost;}});return {n,val};}

function doPost(type){
  const so=S.social;if(so.posts>=postsPerDay())return;
  const P=POSTS.find(p=>p.id===type);if(!P||S.level<(P.req||1))return;
  const itemId=R.postItem&&S.items[R.postItem]&&S.items[R.postItem].unlocked?R.postItem:defaultPostItem();const it=ITEM[itemId];
  const cost=P.cost?Math.round(P.cost*levelScale()):0;
  if(type==='concours'&&S.items[itemId].stock<15){toast(`Il faut au moins 15 ${it.emoji} en stock pour le concours.`,'bad');return;}
  if(cost&&!spend(cost,'invest'))return;
  const brand=(.6+S.rep*.12)*(1+.08*(S.level-1));const trendHit=itemId===so.trend;
  let gain=0,viral=0,buzz=0,text='';

  else if(type==='story'){gain=rand(4,12)*brand;viral=.03;S.rep=clamp(S.rep+.02,1,5);text=pick(STORY_TXT);}
  else if(type==='concours'){S.items[itemId].stock-=15;gain=rand(50,130)*brand;buzz=.12;viral=.08;text=CONCOURS_TXT(it);}
  else{gain=rand(150,480)*brand;buzz=.3;viral=.25;text=pick(COLLAB_TXT);}
  gain+=so.followers*rand(.01,.03);
  const isViral=Math.random()<viral;
  if(isViral){gain=gain*2.5+150+so.followers*.15;buzz+=.35;}
  if(isViral)S.flags.viral=true;
  so.followers+=gain;so.gainedToday=(so.gainedToday||0)+gain;so.buzz=Math.min(1.2,so.buzz+buzz);so.posts++;so.totalPosts=(so.totalPosts||0)+1;
  addFeed({who:'me',text,likes:Math.round((so.followers*rand(.04,.12)+gain*rand(.8,1.6))*(isViral?4:1)),viral:isViral,gain});
  Snd.buy();

}

function playerPriceIdx(){const u=ITEMS.filter(i=>S.items[i.id].unlocked);return u.reduce((a,i)=>a+S.items[i.id].price/i.base,0)/Math.max(1,u.length);}
function playerAttr(){return (.4+S.rep*.2)*Math.pow(1/playerPriceIdx(),1.2)*(1+.12*(S.level-1))*socialFactor()*(1+.03*(unlockedCount()-2));}

function compFactor(){return clamp(1.25-activeComps().reduce((a,c)=>a+.065*compAttr(c),0),.6,1.25);}
function shares(){
  const list=[{id:'me',name:'Le Petit Comptoir',icon:'☕',color:'#e2456b',a:playerAttr()}];
  S.comps.forEach(c=>{if(c.closed)return;const def=COMP[c.id];list.push({id:c.id,name:def.name,icon:def.icon,color:c.owned?'#f0ad3c':def.color,a:compAttr(c),owned:c.owned});});
  const tot=list.reduce((a,x)=>a+x.a,0);list.forEach(x=>x.s=x.a/tot);return list;
}
function compPrice(c){let v=1800*c.size*(.6+c.rep*.15)+Math.max(0,c.cash)*.6;if(c.trouble>0)v*=.6;return Math.round(v/50)*50;}
function evolveComps(news){
  const sh=shares();const myShare=sh.filter(x=>x.id==='me'||x.owned).reduce((a,x)=>a+x.s,0);
  S.comps.forEach(c=>{
    if(c.owned||c.closed)return;const def=COMP[c.id];
    if(c.promo>0)c.promo--;
    const s=(sh.find(x=>x.id===c.id)||{s:.1}).s;
    const profit=Math.round(s*1100*c.size*rand(.6,1.3)-70*c.size*(c.price<.92?1.25:1));
    c.cash+=profit;c.lastProfit=profit;
    c.rep=clamp(c.rep+rand(-.06,.07)+(def.style==='cosy'?.01:0),2,4.8);
    c.price+=(def.price-c.price)*.12;
    c.followers=Math.max(50,Math.round(c.followers*(1+rand(-.01,.03))));
    if(Math.random()<.24*(def.style==='agressif'?1.6:1)){
      const acts=['promo','produit','social'];
      if(myShare>.3&&def.style!=='cosy')acts.push('guerre');
      if(myShare>.3&&def.style==='agressif')acts.push('guerre');
      if(S.staff.length&&def.style!=='cosy')acts.push('debauche');
      if(c.cash>3500*c.size&&def.style==='agressif')acts.push('expansion');
      const a=pick(acts);
      if(a==='promo'){c.promo=3;news.push(`${def.icon} ${def.name} lance une promo pendant 3 jours.`);addFeed({who:'comp',compId:c.id,text:`${def.icon} PROMO chez ${def.name} : -20 % pendant 3 jours !`,likes:Math.round(c.followers*rand(.03,.08))});}
      else if(a==='guerre'){c.price=Math.max(.7,c.price*.88);news.push(`⚔️ ${def.name} baisse ses prix pour te contrer !`);}
      else if(a==='produit'){c.rep=clamp(c.rep+.1,2,4.8);const it=pick(ITEMS);news.push(`${def.icon} ${def.name} lance une nouveauté : ${it.emoji} ${it.short.toLowerCase()}.`);}
      else if(a==='social'){c.followers+=Math.round(rand(50,200));addFeed({who:'comp',compId:c.id,text:pick(COMP_POSTS)(def),likes:Math.round(c.followers*rand(.02,.06))});}
      else if(a==='debauche'){if(!R.evQueue.some(e=>e.poach))R.evQueue.push(poachEvent(c,pick(S.staff)));}
      else if(a==='expansion'){c.size++;c.cash-=2500;news.push(`🏗️ ${def.name} ouvre une nouvelle boutique (${c.size} au total).`);}
    }
    if(c.cash<0){c.trouble++;if(c.trouble===1)news.push(`📉 ${def.name} est en difficulté : son rachat coûte 40 % moins cher.`);if(c.trouble>=6&&Math.random()<.3){c.closed=true;news.push(`🔒 ${def.name} a mis la clé sous la porte.`);}}
    else c.trouble=0;
  });
}

function tabBilan(){
  const P=R.bilanP||'today';const D=bilanData(P);
  let h=`<div class="sec-head"><div><h3>Bilan</h3><p class="muted small">D’où vient ton argent, et où il part.</p></div></div>`;
  h+=`<div class="seg" role="group" aria-label="Période du bilan">${[['today','Aujourd’hui'],['yesterday','Hier'],['week','7 jours']].map(([k,l])=>`<button type="button" data-act="bilanp" data-id="${k}" aria-pressed="${P===k}">${l}</button>`).join('')}</div>`;
  if(!D)return h+`<p class="hint">Pas encore de données pour cette période : termine au moins une journée.</p>`;
  const ent=Object.entries(D.book||{}).filter(([,v])=>v>.004).sort((a,b)=>b[1]-a[1]);
  const sor=Object.entries(D.book||{}).filter(([,v])=>v<-.004).sort((a,b)=>a[1]-b[1]);
  const tin=ent.reduce((a,[,v])=>a+v,0),tout=sor.reduce((a,[,v])=>a-v,0),net=tin-tout;
  h+=`<p class="muted small">${D.label}</p><div class="statgrid"><div><b class="v-pos">+${money(tin)}</b><span>entrées</span></div><div><b class="v-neg">−${money(tout)}</b><span>sorties</span></div><div><b class="${net>=0?'v-pos':'v-neg'}">${net>=0?'+':'−'}${money(Math.abs(net))}</b><span>résultat</span></div><div><b>${money(S.money)}</b><span>en caisse maintenant</span></div></div>`;
  const mx=Math.max(1,...ent.map(([,v])=>v),...sor.map(([,v])=>-v));
  const row=(k,v,cls)=>{const c=BOOK[k]||{i:'•',l:k};const pct=Math.round(Math.abs(v)/Math.max(.01,v>0?tin:tout)*100);return `<div class="bk-row ${cls}"><span>${c.i} ${c.l} <span class="bk-sub">${pct<1?'< 1':pct} %</span></span><b class="${v>=0?'v-pos':'v-neg'}">${v>=0?'+':'−'}${eur(Math.abs(v))}</b><div class="bar"><i style="width:${(Math.abs(v)/mx*100).toFixed(1)}%"></i></div></div>`;};
  h+=`<h4>💚 D’où vient l’argent</h4>`+(ent.length?`<div class="bk-list">${ent.map(([k,v])=>row(k,v,'bk-in')).join('')}</div>`:'<p class="muted small">Aucune entrée sur cette période.</p>');
  h+=`<h4>❤️ Où part l’argent</h4>`+(sor.length?`<div class="bk-list">${sor.map(([k,v])=>row(k,v,'bk-out')).join('')}</div>`:'<p class="muted small">Aucune dépense sur cette période.</p>');
  const prods=Object.entries(D.sales||{}).filter(([id])=>ITEM[id]).sort((a,b)=>b[1].v-a[1].v);
  if(prods.length){const pm=prods[0][1].v||1;h+=`<h4>☕ Ventes par produit</h4><div class="bk-list">${prods.slice(0,12).map(([id,b])=>{const it=ITEM[id];const marge=b.v-b.n*unitCost(it);return `<div class="bk-row bk-in"><span>${it.emoji} ${it.short} <span class="bk-sub">× ${b.n}</span></span><b>${eur(b.v)}</b><div class="bar"><i style="width:${(b.v/pm*100).toFixed(1)}%"></i></div><span class="bk-sub">marge estimée ${eur(marge)} (${Math.round(marge/Math.max(.01,b.v)*100)} %)</span></div>`;}).join('')}</div>`;}
  const L=D.lost||{};const nLost=(L.attente||0)+(L.file||0)+(L.prix||0)+(L.rupture||0);
  if(nLost){const avg=D.avg||avgTicket();h+=`<h4>💸 Manque à gagner</h4><p class="muted small">${nLost} client${nLost>1?'s':''} reparti${nLost>1?'s':''} sans rien acheter, soit environ <b>${eur(nLost*avg,0)}</b> de ventes perdues.</p><div class="tbreak">${[['attente','⏱️ Attente trop longue'],['file','🚪 File trop longue en entrant'],['prix','💸 Prix trop élevés'],['rupture','📦 Produit en rupture']].filter(([k])=>L[k]).map(([k,l])=>`<div><span>${l} · ${L[k]}</span><b class="v-neg">≈ −${eur(L[k]*avg,0)}</b></div>`).join('')}</div>`;}
  const tips=bilanTips(D,tin,tout,L);if(tips.length)h+=`<h4>💡 Conseils</h4><ul class="advice">${tips.map(x=>`<li>${x}</li>`).join('')}</ul>`;
  return h;
}

function chefRun(news){
  const C=S.chef;if(!C||!C.hired)return;
  const done=[],added=[],upg=[];const room=()=>S.money-C.reserve;
  if(C.tasks.carte){R.cat='carte';BASE_ITEMS.filter(i=>!S.items[i.id].unlocked&&S.level>=i.lvl&&inSeason(i)).sort((a,b)=>a.unlock-b.unlock).forEach(it=>{if(it.unlock<=room()&&spend(it.unlock,'invest')){const s=S.items[it.id];s.unlocked=true;s.stock=Math.max(s.stock,10);added.push(it.emoji);}});}
  if(C.tasks.recettes){R.cat='carte';ITEMS.filter(i=>!i.sig&&S.items[i.id].unlocked&&S.items[i.id].recipe<3).sort((a,b)=>(S.items[b.id].sold||0)-(S.items[a.id].sold||0)).forEach(it=>{const s=S.items[it.id];const c=recipeCost(it,s.recipe);if(c<=room()&&spend(c,'invest')){s.recipe++;upg.push(it.emoji+'★'.repeat(s.recipe));}});}
  if(C.tasks.labo&&S.level>=3&&!S.lab.pending&&S.sig.length<5&&labCost()<=room()){
    const untried=[];LAB_BASES.forEach(b=>LAB_TWISTS.forEach(t=>{if(!S.lab.tried[b.id+':'+t.id])untried.push([b.id,t.id]);}));
    if(untried.length){const good=untried.filter(([b,t])=>(COMBO[b+':'+t]||0)>=4);const pc=good.length&&Math.random()<.6?pick(good):pick(untried);R.cat='labo';
      if(spend(labCost(),'invest')){S.lab.pending={base:pc[0],twist:pc[1],by:'chef'};done.push(`test au labo : ${LB[pc[0]].name} ${LT[pc[1]].name}`);}}
  }
  R.cat=null;
  if(upg.length)done.unshift(`${upg.length} recette${upg.length>1?'s':''} améliorée${upg.length>1?'s':''} (${upg.join(' ')})`);
  if(added.length)done.unshift(`${added.length} produit${added.length>1?'s':''} ajouté${added.length>1?'s':''} à la carte (${added.join(' ')})`);
  if(done.length){news.push(`🧑‍🍳 Responsable de la carte : ${done.join(' · ')}.`);C.log.unshift({day:S.day,text:done.join(' · ')});if(C.log.length>8)C.log.length=8;}
}

/* ---------- Saisons, carte, maîtrise ---------- */
function incomeMult(){return 1+.01*Object.keys(S.trophies||{}).length;}
function rebuildItems(){
  ITEMS.length=0;BASE_ITEMS.forEach(i=>ITEMS.push(i));(S.sig||[]).forEach(i=>ITEMS.push(i));
  Object.keys(ITEM).forEach(k=>delete ITEM[k]);ITEMS.forEach(i=>ITEM[i.id]=i);
  ITEMS.forEach(it=>{if(!S.items[it.id])S.items[it.id]={unlocked:!!it.sig,price:it.base,stock:it.sig?10:0,recipe:1};});
}
function masteryTier(id){const s=S.items[id];const n=(s&&s.sold)||0;return n>=MASTERY[3]?3:n>=MASTERY[2]?2:n>=MASTERY[1]?1:0;}
const goldCount=()=>ITEMS.filter(i=>masteryTier(i.id)>=3).length;
function addSold(id){const s=S.items[id];if(!s)return;s.sold=(s.sold||0)+1;R.day.sold[id]=(R.day.sold[id]||0)+1;const k=MASTERY.indexOf(s.sold);if(k>0){const it=ITEM[id];toast(`${MEDALS[k]} Maîtrise ${['','bronze','argent','or'][k]} : ${it.emoji} ${it.short} (+${Math.round(MASTERY_BONUS[k]*100)} % de prix accepté)`,'gold');Snd.bell();}}
function medal(id){const t=masteryTier(id);const n=(S.items[id]&&S.items[id].sold)||0;const nx=MASTERY[t+1];return `<span class="tag" title="Maîtrise : ${n} vendus${nx?`, prochain palier à ${nx}`:''}">${t?MEDALS[t]:'🔸'} ${n}${nx?' / '+nx:''}</span>`;}
function expectedCust(){return BASE_RATE*DAY_LEN*trafficMult();}
function avgTicket(){const m=ITEMS.filter(onMenu);return m.length?m.reduce((a,i)=>a+S.items[i.id].price,0)/m.length*1.25:3;}
function seasonNews(news){
  const se=seasonOf();
  if(dayInSeason()===1&&S.day>1){const it=BASE_ITEMS.find(i=>i.season===se.id);news.push(`${se.icon} ${se.name} commence !${it?` Produit de saison : ${it.emoji} ${it.name}.`:''}`);}
  const f1=festivalOn(S.day),f3=festivalOn(S.day+2);
  if(f1)news.push(`${f1.icon} Demain, c’est ${f1.name} : prépare-toi à la foule !`);
  else if(f3)news.push(`${f3.icon} Dans 3 jours : ${f3.name}. Pense au stock !`);
}

/* ---------- Missions du jour ---------- */
function genMissions(){
  const pool=MISSION_TPL.filter(t=>!t.cond||t.cond());const list=[];const used=new Set();
  while(list.length<3&&used.size<pool.length){const left=pool.filter(x=>!used.has(x.id));const t=wpick(left,x=>x.w||1);used.add(t.id);const g=t.gen();if(!g)continue;
    list.push(Object.assign({id:t.id,icon:t.icon,end:!!t.end,done:false,reward:Math.round((50+25*list.length)*levelScale())},g));}
  S.missions={day:S.day,list,bonus:false};
}
function missionProg(m,force){if(m.done)return m.n;if(m.end)return 0;if(R.phase==='closed'&&!force)return m.id==='post'?S.social.posts:0;return MT[m.id]?MT[m.id].prog(m):0;}
function rewardMission(m){
  m.done=true;S.money+=m.reward;book('recompenses',m.reward);addXP(10);S.life.missions=(S.life.missions||0)+1;
  toast(`🎯 Mission réussie : ${m.text} (+${costTxt(m.reward)})`,'gold');Snd.bell();
  if(!S.missions.bonus&&S.missions.list.every(x=>x.done)){S.missions.bonus=true;const b=Math.round(150*levelScale());S.money+=b;book('recompenses',b);addXP(25);toastLater(`🎁 Coffre du jour : toutes les missions réussies ! +${costTxt(b)}`,'gold',900);confettiBurst(120);}
  saveSoon();
}
function checkMissions(force){if(S.missions.day!==S.day)return;S.missions.list.forEach(m=>{if(!m.done&&!m.end&&missionProg(m,force)>=m.n)rewardMission(m);});}
function evalMissionsEnd(d){
  if(S.missions.day!==S.day)return;checkMissions(true);
  const avg=d.sats.length?d.sats.reduce((a,b)=>a+b,0)/d.sats.length:0;
  S.missions.list.forEach(m=>{if(m.done||!m.end)return;if(m.id==='nolost'&&d.impatient===0&&d.served>=10)rewardMission(m);if(m.id==='rating'&&d.sats.length>=5&&avg>=m.n)rewardMission(m);});
}
function renderMissions(){
  const el=$('#missions');const L=S.missions.list;
  const html=L.map(m=>{const p=Math.min(m.n,missionProg(m));const pct=m.done?100:clamp(p/m.n*100,0,100);
    const pt=m.done?'Réussi !':m.end?'Résultat au bilan du soir':m.id==='rev'?`${eur(p,0)} / ${eur(m.n,0)}`:`${Math.floor(p)} / ${m.n}`;
    return `<div class="mis ${m.done?'done':''}"><span aria-hidden="true">${m.icon}</span><div class="grow"><b>${esc(m.text)}</b><div class="bar"><i style="width:${pct}%"></i></div><small class="muted">${pt}</small></div><em>${m.done?'✓':'+'+costTxt(m.reward)}</em></div>`;}).join('');
  if(el._h!==html){el._h=html;el.innerHTML=html;}
}
function missionsHtml(){const L=S.missions.list;return `<h4>Missions du jour</h4><div class="feed">${L.map(m=>`<div class="mis ${m.done?'done':''}"><span aria-hidden="true">${m.icon}</span><div class="grow"><b>${esc(m.text)}</b></div><em>${m.done?'✓':'+'+costTxt(m.reward)}</em></div>`).join('')}</div><p class="muted small">Réussis les 3 pour ouvrir le coffre du jour. Elles sont aussi affichées sous la salle. 📅 Série de connexion : ${S.login.streak} jour${S.login.streak>1?'s':''}.</p>`;}

function checkTrophies(){TROPHIES.forEach(t=>{if(S.trophies[t.id])return;let ok=false;try{ok=t.ok();}catch(e){ok=false;}if(ok){S.trophies[t.id]=S.day;toast(`🏆 Trophée : ${t.icon} ${t.name} (+1 % de revenus)`,'gold');confettiBurst(70);Snd.level();saveSoon();if(tab==='obj')renderPanel();}});}
function trophiesHtml(){const n=Object.keys(S.trophies).length;return `<h4>Trophées · ${n} / ${TROPHIES.length}</h4><p class="muted small">Chaque trophée donne +1 % sur tous tes revenus, pour toujours. Bonus actuel : +${Math.round((incomeMult()-1)*100)} %.</p><div class="trophies">${TROPHIES.map(t=>{const on=!!S.trophies[t.id];return `<div class="tro ${on?'on':''}"><span aria-hidden="true">${on?t.icon:'🔒'}</span><b>${t.name}</b><small>${t.desc}</small></div>`;}).join('')}</div>`;}

/* ---------- Franchise ---------- */
const frCount=cid=>S.fr.list.filter(f=>f.city===cid).length;
const pointsOfSale=()=>1+S.firm.locations.length+S.fr.list.length;
const tierIdx=()=>TIERS.reduce((a,t,i)=>pointsOfSale()>=t.n?i:a,0);
const qStars=q=>clamp(Math.round((q-.45)*5),1,5);
const cityOpen=c=>c.region==='fr'||tierIdx()>=3;
const cityFee=c=>Math.round(2500*c.size*(c.region==='int'?1.6:1)/50)*50;
const prospectCost=c=>Math.round(350*c.size*(c.region==='int'?2:1)*(1+.3*tierIdx())/10)*10;
const natCost=()=>Math.round(3000*(1+.6*tierIdx()));
function poisson(l){const L=Math.exp(-l);let k=0,p=1;do{k++;p*=Math.random();}while(p>L&&k<20);return k-1;}
function rateHint(){const r=S.fr.rate;return r<=5?'Royalties basses : beaucoup de candidats et un réseau heureux, mais moins de revenus.':r<=7?'Royalties équilibrées : le bon compromis.':'Royalties élevées : plus de revenus par boutique, mais moins de candidats et des franchisés qui grincent des dents.';}
function checkTier(){const t=tierIdx();if(t>(S.tierIdx||0)){S.tierIdx=t;const T=TIERS[t];setTimeout(()=>showBanner(`${T.icon} ${T.name} !`,`${pointsOfSale()} points de vente`),300);confettiBurst(160);Snd.level();pushNews(`${T.icon} ${S.firm.name} devient : ${T.name}.`);}}
function genFranchiseCands(news,force){
  if(!S.fr.launched)return;
  S.fr.cands=S.fr.cands.filter(c=>S.day-c.day<3);
  const ch=CHARTE[S.fr.charte],ti=tierIdx();
  const taken=cid=>frCount(cid)+S.fr.cands.filter(x=>x.city===cid).length;
  const before=S.fr.cands.length;
  const mk=city=>S.fr.cands.push({id:'C'+(S.fr.seq=(S.fr.seq||0)+1),city:city.id,owner:pick(NAMES)+' '+pick(SURNAMES),quality:clamp(rand(.7,1.15)+ch.qShift,.5,1.35),fee:Math.round(cityFee(city)*rand(.85,1.15)/50)*50,day:S.day,color:pick(SHIRTS)});
  Object.keys(S.fr.prospect).forEach(cid=>{const d=S.fr.prospect[cid];if(d>=S.day)return;delete S.fr.prospect[cid];if(d===S.day-1){const c=CITY[cid];if(c&&taken(cid)<c.slots){mk(c);if(Math.random()<.5&&taken(cid)<c.slots)mk(c);}}});
  const appeal=clamp((S.rep-2.8)*.6,0,1.4)+Math.log10(1+S.social.followers/500)*.45+ti*.12+(S.fr.natCampaign>0?.7:0);
  const lambda=Math.max(.15,appeal*(1-(S.fr.rate-6)*.12)*ch.cand);
  const k=force||poisson(lambda);
  for(let i=0;i<k&&S.fr.cands.length<6;i++){const pool=CITIES.filter(c=>cityOpen(c)&&taken(c.id)<c.slots);if(!pool.length)break;mk(wpick(pool,c=>c.size));}
  const nn=S.fr.cands.length-before;if(nn>0&&news)news.push(`✍️ ${nn} nouvelle${nn>1?'s':''} candidature${nn>1?'s':''} pour ouvrir un Petit Comptoir en franchise.`);
}
function frLaunch(){
  if(S.fr.launched||!S.firm.created||S.level<4||!S.firm.locations.length)return;
  if(!spend(FR_COST,'invest'))return;
  S.fr.launched=true;showBanner('Franchise lancée !','Le Petit Comptoir part à la conquête de la France');confettiBurst(180);Snd.level();
  pushNews(`🗺️ ${S.firm.name} lance sa franchise.`);genFranchiseCands(null,2);saveSoon();renderPanel();
}
function frAccept(id){
  const c=S.fr.cands.find(x=>x.id===id);if(!c)return;const city=CITY[c.city];
  S.fr.cands=S.fr.cands.filter(x=>x!==c);
  if(frCount(c.city)>=city.slots){toast(`${city.name} est déjà complet.`,'bad');renderPanel();return;}
  S.fr.list.push({id:'F'+(S.fr.seq=(S.fr.seq||0)+1),city:c.city,owner:c.owner,quality:c.quality,sat:70,day:S.day,last:0});
  S.money+=c.fee;book('droits',c.fee);addXP(30);toast(`✍️ ${c.owner} ouvre un Petit Comptoir à ${city.name} ! +${eur(c.fee,0)}`,'gold');confettiBurst(90);Snd.coin();
  pushNews(`🗺️ Nouveau Petit Comptoir à ${city.name}.`);checkTier();saveSoon();renderPanel();
}
function frProspect(cid){const c=CITY[cid];if(!c||!cityOpen(c)||frCount(cid)>=c.slots||S.fr.prospect[cid]===S.day)return;if(!spend(prospectCost(c),'invest'))return;S.fr.prospect[cid]=S.day;toast(`📣 Prospection lancée à ${c.name} : réponses au prochain bilan du soir.`);saveSoon();renderPanel();}
function scandalEvent(f){
  const city=CITY[f.city];const audit=Math.round(800*(1+.3*tierIdx()));
  return {scandal:true,icon:'🚨',title:`Scandale à ${city.name}`,text:`Le Petit Comptoir de ${city.name}, tenu par ${f.owner}, est épinglé par les services d’hygiène. La presse locale s’en empare…`,
   choices:[{label:'Envoyer une équipe d’audit',raw:audit,fx(){f.quality=Math.min(1.35,f.quality+.15);S.rep=clamp(S.rep-.02,1,5);return 'L’audit remet tout en ordre : la qualité de cette adresse remonte.';}},
    {label:'Retirer la licence',fx(){S.fr.list=S.fr.list.filter(x=>x!==f);S.rep=clamp(S.rep+.02,1,5);return `La franchise de ${city.name} ferme. Ta fermeté rassure les clients.`;}},
    {label:'Étouffer l’affaire',fx(){if(Math.random()<.55)return 'Ouf, l’histoire retombe d’elle-même.';S.rep=clamp(S.rep-.25,1,5);S.social.followers=Math.round(S.social.followers*.95);return 'L’affaire explose sur les réseaux : −0,25 ★ et des désabonnements.';}}]};
}
function franchiseDay(news){
  if(!S.fr.launched||!S.fr.list.length){S.fr.lastRoy=0;if(S.fr.natCampaign>0)S.fr.natCampaign--;return {roy:0,support:0};}
  const brand=(.6+S.rep*.1)*(1+Math.min(.5,Math.log10(1+S.social.followers/1000)*.2));const ch=CHARTE[S.fr.charte];const im=incomeMult();let roy=0,fol=0;
  S.fr.list.slice().forEach(f=>{const city=CITY[f.city];if(!city)return;
    const rev=650*city.size*f.quality*brand*(S.fr.natCampaign>0?1.25:1)*weekday().t*rand(.8,1.2)*im;
    const r=rev*(S.fr.rate+(S.fr.centrale?2:0))/100;roy+=r;f.last=Math.round(r);
    f.sat=clamp(f.sat+(6.5-S.fr.rate)+(S.fr.centrale?-.5:0)+(S.fr.academie?1:0)+rand(-2,2),0,100);
    if(S.fr.academie)f.quality=Math.min(1.35,f.quality+.004);
    fol+=f.quality*city.size*rand(2,5);
    if(f.sat<15&&Math.random()<.3){S.fr.list=S.fr.list.filter(x=>x!==f);news.push(`💔 ${f.owner} quitte le réseau à ${city.name} : royalties jugées trop élevées.`);return;}

/* ---------- Bourse : ton action, les groupes rivaux et les cafés des joueurs ---------- */
// Le fondateur garde toujours ses 100 000 actions : entrer en Bourse crée de nouvelles actions
// vendues à des investisseurs. Rien n'est remis à zéro, la part du joueur baisse simplement.
const SH0=100000,IPO_MIN=100000,MIN_OWN=.51;
const IPO_FEE=.05,ISSUE_FEE=.03,BUYBACK_PREM=.02,TRADE_FEE=.01;
const IPO_PCTS=[.1,.2,.3,.4,.49],DIV_RATES=[0,.1,.25,.5];
// Cours de départ, tendance par soir, volatilité et dividende quotidien des groupes rivaux
const RSTOCK={royal:{p:60,dr:.0035,vol:.02,y:.0012},delices:{p:24,dr:.0055,vol:.035,y:.0004},conti:{p:350,dr:.0028,vol:.015,y:.0018}};
const MKT_EV=[
 {mood:.08,t:()=>'📈 Euphorie à la Bourse : les investisseurs s’arrachent les valeurs du café.'},
 {mood:-.1,t:()=>'📉 Coup de froid sur les marchés : tous les cours reculent.'},
 {mood:-.05,t:()=>'☕ Flambée du prix de l’arabica : les groupes de café inquiètent les investisseurs.'},
 {mood:.05,t:()=>'🌞 Belle saison touristique annoncée : les terrasses font rêver la Bourse.'},
 {one:.12,t:r=>`🚀 ${r.name} annonce des résultats record : l’action bondit.`},
 {one:-.15,t:r=>`🧾 Contrôle sanitaire raté chez ${r.name} : l’action chute.`},
 {one:.08,t:r=>`🤝 ${r.name} rachète une chaîne de salons de thé.`},
 {one:-.1,t:r=>`🥶 ${r.name} rate le lancement de ses boissons glacées.`},
 {me:.08,listed:true,t:()=>`🗞️ La presse économique salue la gestion de ${S.firm.name} : ton action grimpe.`},
 {me:-.06,listed:true,t:()=>`📰 Un analyste juge ${S.firm.name} trop cher : ton action recule.`},
];
function bourseDefault(){return {listed:false,day:0,raised:0,float:0,held:0,offer:0,hist:[],div:0,divPaid:0,divIn:0,mood:1,noise:1,ppv:0,
  rv:Object.fromEntries(RIVALS.map(r=>[r.id,{p:RSTOCK[r.id].p,hist:[RSTOCK[r.id].p]}])),pf:{}};}
function bourseMerge(d){
  const o=Object.assign(bourseDefault(),d&&typeof d==='object'?d:{});
  const rv={};RIVALS.forEach(r=>{const x=o.rv&&o.rv[r.id];rv[r.id]=x&&x.p>0?{p:+x.p,hist:Array.isArray(x.hist)&&x.hist.length?x.hist.slice(-30):[+x.p]}:{p:RSTOCK[r.id].p,hist:[RSTOCK[r.id].p]};});o.rv=rv;
  const pf={};Object.entries(o.pf||{}).forEach(([k,v])=>{if(RSTOCK[k]&&v&&v.n>0)pf[k]={n:Math.floor(v.n),cost:+v.cost||0};});o.pf=pf;
  ['float','held','offer'].forEach(k=>o[k]=Math.max(0,Math.floor(+o[k]||0)));
  if(!Array.isArray(o.hist))o.hist=[];if(!DIV_RATES.includes(o.div))o.div=0;
  o.mood=clamp(+o.mood||1,.7,1.35);o.noise=clamp(+o.noise||1,.8,1.25);
  return o;
}
const gauss=()=>(Math.random()+Math.random()+Math.random()+Math.random()-2)*1.732;
const shN=()=>SH0+S.bourse.float+S.bourse.held;
const ownPct=()=>SH0/shN();
const issueMax=()=>Math.max(0,Math.floor(SH0/MIN_OWN-shN()-S.bourse.offer));
const avgProfit=()=>{const H=S.history.slice(-7);return H.length?H.reduce((a,h)=>a+(+h.profit||0),0)/H.length:0;};
const pfValue=()=>Object.entries(S.bourse.pf).reduce((a,[k,h])=>a+h.n*S.bourse.rv[k].p,0)+(S.bourse.ppv||0);
// Cours en direct : valeur du groupe (trésorerie comprise) + prime sur les bénéfices, confiance et humeur du marché
function stockPrice(n){
  const B=S.bourse;const fund=Math.max(2000,firmValue()+15*Math.max(0,avgProfit()));
  const conf=1+.6*B.div+(S.rep-3)*.05;
  return Math.max(.01,fund*conf*B.mood*(B.listed?B.noise:1)/(n||shN()));
}
const ipoShares=p=>Math.round(SH0*p/(1-p));
const pr2=p=>p>=1000?eur(p,0):eur(p,2);
const pctTxt=x=>(x>-.0005?'+':'−')+num1(Math.abs(x*100))+' %';
const fmtN=n=>Math.round(n).toLocaleString('fr-FR');
const moodTxt=()=>{const m=S.bourse.mood;return m>=1.12?'🤩 euphorique':m>=1.03?'🙂 optimiste':m>=.97?'😐 calme':m>=.88?'😟 inquiète':'😱 en panique';};
function sparkSvg(pts,label,mini){
  const P=pts.filter(v=>v>0);if(P.length<2)return mini?'':'<p class="muted small">Le graphique apparaîtra après la première clôture.</p>';
  const w=mini?90:600,h=mini?34:120,pad=mini?2:6;const mn=Math.min(...P),mx=Math.max(...P),rg=mx-mn||mx*.01||1;
  const xy=P.map((v,i)=>[pad+i*(w-2*pad)/(P.length-1),pad+(h-2*pad)*(1-(v-mn)/rg)]);
  const up=P[P.length-1]>=P[0];const d=xy.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  return `<svg class="bk-spark${mini?' mini':''}" viewBox="0 0 ${w} ${h}" ${mini?'':'preserveAspectRatio="none" '}${label?`role="img" aria-label="${label}"`:'aria-hidden="true"'}><path d="${d} L${xy[xy.length-1][0].toFixed(1)} ${h} L${xy[0][0].toFixed(1)} ${h}Z" class="bk-area ${up?'up':'down'}"/><path d="${d}" class="bk-line ${up?'up':'down'}" vector-effect="non-scaling-stroke"/></svg>`;
}

// Chaque soir : humeur du marché, événements, cours des rivaux, dividendes reçus et versés
function bourseNight(sm,news){
  const B=S.bourse;if(!S.firm.created&&!Object.keys(B.pf).length)return;
  const m0=B.mood;B.mood=clamp(B.mood+(1-B.mood)*.12+gauss()*.02,.7,1.35);
  let one=null,oneD=0,meD=0;
  if(Math.random()<.15){const ev=pick(MKT_EV.filter(e=>!e.listed||B.listed));
    if(ev.mood)B.mood=clamp(B.mood+ev.mood,.7,1.35);if(ev.one){one=pick(RIVALS);oneD=ev.one;}if(ev.me)meD=ev.me;news.push(ev.t(one));}
  const mr=B.mood/m0;let divIn=0;
  RIVALS.forEach(r=>{const x=B.rv[r.id],k=RSTOCK[r.id];
    x.p=Math.max(1,Math.round(x.p*mr*(1+k.dr+k.vol*gauss()+(one===r?oneD:0))*100)/100);x.hist.push(x.p);if(x.hist.length>30)x.hist.shift();
    const h=B.pf[r.id];if(h&&h.n>0)divIn+=h.n*x.p*k.y;});
  divIn=Math.round(divIn*100)/100;sm.bk={divIn};
  if(divIn>0){S.money+=divIn;book('bourse',divIn);B.divIn=(B.divIn||0)+divIn;}
  if(!B.listed)return;
  B.noise=clamp(B.noise*(1+gauss()*.02)+(1-B.noise)*.15+meD,.8,1.25);
  let paid=0,ps=0;
  if(B.div>0&&sm.profit>0){ps=sm.profit*B.div/shN();paid=Math.round(ps*(B.float+B.held)*100)/100;
    if(paid>0){S.money-=paid;book('dividendes',-paid);B.divPaid=(B.divPaid||0)+paid;}}
  const prev=B.hist.length?B.hist[B.hist.length-1]:0,p=Math.round(stockPrice()*100)/100;
  B.hist.push(p);if(B.hist.length>30)B.hist.shift();
  Object.assign(sm.bk,{price:p,chg:prev?p/prev-1:0,paid,ps});
}

function bkIpo(){
  const B=S.bourse,p=R.bkIpo||.2;if(B.listed||!S.firm.created||firmValue()<IPO_MIN)return;
  const P=stockPrice(SH0),k=ipoShares(p),cash=Math.round(k*P*(1-IPO_FEE));
  B.listed=true;B.day=S.day;B.float=k;B.raised=cash;B.noise=1;B.hist=[Math.round(P*100)/100];

function bkIssue(k){
  const B=S.bourse;k=Math.min(Math.floor(k),issueMax());if(!B.listed||k<1)return;
  const cash=Math.round(k*stockPrice()*(1-ISSUE_FEE));B.float+=k;B.raised+=cash;S.money+=cash;book('capital',cash);
  toast(`🔔 ${fmtN(k)} nouvelles actions vendues : +${money(cash)}`,'gold');Snd.coin();saveSoon();renderPanel();updateHud();
}
function bkBuyback(k){
  const B=S.bourse;k=Math.min(Math.floor(k),B.float);if(!B.listed||k<1)return;
  const cost=Math.round(k*stockPrice()*(1+BUYBACK_PREM)*100)/100;
  if(S.money<cost){toast('Pas assez de trésorerie pour ce rachat.','bad');return;}
  S.money-=cost;book('capital',-cost);B.float-=k;
  toast(`🔁 ${fmtN(k)} actions rachetées : tu détiens maintenant ${num1(ownPct()*100)} % du capital.`,'gold');Snd.buy();saveSoon();renderPanel();updateHud();
}
/* Actions sur les groupes rivaux */
function bkRivalBuy(id,f){
  const x=S.bourse.rv[id];if(!x)return;const unit=x.p*(1+TRADE_FEE);const n=Math.floor(Math.max(0,S.money)*f/unit);
  if(n<1){toast('Pas assez de trésorerie pour acheter une action.','bad');return;}
  const cost=Math.round(n*unit*100)/100;S.money-=cost;book('placements',-cost);
  const h=S.bourse.pf[id]||(S.bourse.pf[id]={n:0,cost:0});h.n+=n;h.cost+=cost;
  const r=RIVALS.find(z=>z.id===id);toast(`📈 ${fmtN(n)} actions ${r.name} achetées pour ${money(cost)}`,'gold');Snd.buy();saveSoon();renderPanel();updateHud();
}
function bkRivalSell(id,f){
  const h=S.bourse.pf[id],x=S.bourse.rv[id];if(!h||!x)return;const n=f>=1?h.n:Math.ceil(h.n*f);if(n<1)return;
  const gain=Math.round(n*x.p*(1-TRADE_FEE)*100)/100;S.money+=gain;book('bourse',gain);
  h.cost=h.cost*(1-n/h.n);h.n-=n;if(h.n<=0)delete S.bourse.pf[id];
  toast(`💶 ${fmtN(n)} actions vendues : +${money(gain)}`,'gold');Snd.coin();saveSoon();renderPanel();updateHud();
}

const BK={market:null,port:null,t:0,busy:false,claiming:false};
async function bkLoad(force){
  if(!MP.me||BK.busy)return;if(!force&&BK.market&&Date.now()-BK.t<60000)return;
  BK.busy=true;
  try{const [m,p]=await Promise.all([mpRpc('mp_stock_market'),mpRpc('mp_stock_portfolio')]);BK.market=m||[];BK.port=p||[];
    S.bourse.ppv=Math.round(BK.port.reduce((a,x)=>a+x.qty*x.price,0));const mine=BK.market.find(x=>x.me);if(mine)S.bourse.offer=+mine.offer||0;}
  catch(e){if(!BK.market)BK.market=[];if(!BK.port)BK.port=[];}
  BK.t=Date.now();BK.busy=false;if(tab==='bourse'&&$('#modal').hidden)renderPanel();
}
// Publie le cours, le dividende et l'historique ; p_delta ajoute ou retire des actions proposées aux joueurs
async function bkPush(delta){
  const B=S.bourse;if(!MP.me||!B.listed)return null;
  try{const r=await mpRpc('mp_stock_update',{p_price:B.hist[B.hist.length-1]||Math.round(stockPrice()*100)/100,p_div:B.div,p_shares:shN(),p_hist:B.hist.slice(-30),p_offer_delta:Math.round(delta||0)});
    if(r&&r.ok)B.offer=+r.offer||0;return r;}catch(e){return null;}
}
async function bkClaim(){
  if(!MP.me||BK.claiming)return;BK.claiming=true;let r=null;try{r=await mpRpc('mp_stock_claim');}catch(e){r=null;}BK.claiming=false;
  if(!r||!r.n)return;const B=S.bourse,got=[];
  if(r.sale_qty>0){const a=+r.sale_amount||0;S.money+=a;book('capital',a);B.held+=r.sale_qty;B.raised+=a;got.push(`${fmtN(r.sale_qty)} de tes actions achetées par des joueurs : +${money(a)}`);}
  if(r.back_qty>0){const q=Math.min(B.held,r.back_qty);B.held-=q;B.float+=q;}
  if(r.div_amount>0){S.money+=+r.div_amount;book('bourse',+r.div_amount);B.divIn=(B.divIn||0)+(+r.div_amount);got.push(`dividendes des cafés de joueurs : +${money(+r.div_amount)}`);}
  if(r.refund_amount>0){S.money+=+r.refund_amount;book('bourse',+r.refund_amount);got.push(`actions d’un café qui a quitté le jeu remboursées : +${money(+r.refund_amount)}`);}
  if(r.offer!=null)B.offer=+r.offer||0;
  if(got.length){toast('📈 '+got.join(' · '),'gold');Snd.coin();}
  BK.t=0;saveSoon();updateHud();if(tab==='bourse'&&$('#modal').hidden)renderPanel();
}
async function bkSync(sm){
  const B=S.bourse;

}

  if(a==='bkoffer'){if(!B.listed||!q)return;if(q>0&&q>issueMax()){toast('Tu dois garder au moins 51 % du capital.','bad');return;}
    el.disabled=true;const r=await bkPush(q);

function todayKey(t){const d=t?new Date(t):new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}

function applyDaily(r){const s=1+.5*(S.level-1);if(r.money){const g=Math.round(r.money*s);S.money+=g;book('recompenses',g);}if(r.followers)S.social.followers+=Math.round(r.followers*s);if(r.xp)addXP(r.xp);if(r.camp)addCampaign({id:'flyers',name:'Flyers dans le quartier',icon:'📄',traffic:1.2,days:1});Snd.coin();confettiBurst(70);saveSoon();renderPanel();}

  UPGRADES.forEach(u=>{S.upg[u.id]=u.costs.length;});

  LAB_BASES.forEach(b=>LAB_TWISTS.forEach(t=>{S.lab.tried[b.id+':'+t.id]=comboStars(b.id,t.id);}));S.lab.pending=null;
  S.sig.forEach(s=>{delete S.items[s.id];});S.sig=[];
  const bases=new Set();Object.keys(S.lab.tried).filter(k=>S.lab.tried[k]>=5).forEach(k=>{const [b,t]=k.split(':');if(bases.has(b)||S.sig.length>=5)return;bases.add(b);createSig(b,t,5);});
  // Carte complète : recettes ★★★, maîtrise or et réserve pleine
  rebuildItems();const cap=STOCK_CAP[STOCK_CAP.length-1];
  ITEMS.forEach(it=>{const s=S.items[it.id];s.unlocked=true;s.off=false;s.recipe=3;s.sold=Math.max(s.sold||0,MASTERY[3]);s.stock=Math.max(s.stock||0,cap);});

  const want=maxStations()-1,T=TRAITS.star;

  S.staff.forEach(m=>{m.morale=100;});
  if(!S.chef.hired){S.chef.hired=true;S.chef.since=S.day;}
  // Société : toutes les adresses ouvertes et rénovées, tous les concurrents rachetés
  if(!S.firm.created){S.firm.created=true;S.firm.createdDay=S.day;}
  QUARTIERS.forEach(q=>{if(!S.firm.locations.some(l=>l.qid===q.id))S.firm.locations.push(newLocation({name:`Le Petit Comptoir ${q.short}`,icon:q.icon,quartier:q.name,kind:'new',potential:q.potential,rent:q.rent,qid:q.id}));});

  S.firm.locations.forEach(l=>{l.level=5;l.rep=5;});
  // Franchise : toutes les villes complètes, avec des franchisés excellents
  S.fr.launched=true;S.fr.centrale=true;S.fr.academie=true;S.fr.cands=[];
  CITIES.forEach(c=>{while(S.fr.list.filter(f=>f.city===c.id).length<c.slots)S.fr.list.push({id:'F'+(S.fr.seq=(S.fr.seq||0)+1),city:c.id,owner:pick(NAMES)+' '+pick(SURNAMES),quality:1.35,sat:100,day:S.day,last:0});});
  // Objectifs, exploits et finances
  QUESTS.forEach((q,i)=>{S.quests.done[i]=true;S.quests.claimed[i]=true;});
  Object.assign(S.flags,{critic:true,perfect:true,viral:true,art:true});
  S.life.served=Math.max(S.life.served||0,10000);S.life.missions=Math.max(S.life.missions||0,50);
  S.stats.bestDay=Math.max(S.stats.bestDay,3000);S.login.streak=Math.max(S.login.streak||0,7);
  S.loans=[];
  syncStations();syncSeats();checkTier();checkTrophies();

async function claimGifts(){
  if(!Cloud.user||giftBusy)return;giftBusy=true;

  giftBusy=false;if(!gifts.length)return;
  const got=[],notes=[];
  gifts.forEach(g=>{
    const a=Math.max(0,+g.amount||0);if(g.note)notes.push(g.note);
    if(g.kind==='max'){const mb=S.money;maxOut();book('recompenses',S.money-mb);got.push('👑 tout au maximum');}

    else if(g.kind==='rep'){S.rep=5;got.push('réputation à 5 ★');}
    else if(g.kind==='stock'){const cap=stockCap();ITEMS.forEach(i=>{const s=S.items[i.id];if(s&&s.unlocked)s.stock=Math.max(s.stock,cap);});got.push('réserve pleine');}
    else if(g.kind==='menu'){BASE_ITEMS.forEach(i=>{const s=S.items[i.id];if(s&&!s.unlocked){s.unlocked=true;s.stock=Math.max(s.stock,10);}});got.push('toute la carte débloquée');}
  });
  if(!got.length)return;
  showBanner(gifts.some(g=>g.kind==='max')?'👑 Compte boosté !':'🎁 Un cadeau pour toi !',got.slice(0,3).join(' · '));

  if(Cloud.linked())Cloud.push(true).catch(()=>{});if(MP.me){MP.lastPub=0;mpPublish(true);}
}

/* ---------- Sauvegarde en ligne avec compte (site uniquement, via Supabase) ---------- */
const Cloud={sb:null,user:null,meta:null,
  init(){
    const C=window.SITE_CONFIG&&window.SITE_CONFIG.cloud;if(!C||!C.url||!C.key||!window.supabase)return;
    try{this.sb=window.supabase.createClient(C.url,C.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,flowType:'implicit'}});}catch(e){this.sb=null;return;}
    this.sb.auth.getSession().then(({data})=>{this.user=data&&data.session?data.session.user:null;if(this.user)this.fetchMeta();}).catch(()=>{});
    this.sb.auth.onAuthStateChange((ev,session)=>{const was=this.user;this.user=session?session.user:null;if(this.user&&this.user.email&&!this.user.is_anonymous&&(!was||!was.email)){toast(`☁️ Connecté : ${this.user.email}`,'gold');this.fetchMeta();}if((was&&was.id)!==(this.user&&this.user.id))mpOnAuth();});
  },
  on(){return !!this.sb;},
  async login(email){
    const redirect=location.origin+location.pathname;
    // Compte anonyme du multijoueur : on lui rattache l'e-mail pour garder la même vitrine
    if(this.user&&this.user.is_anonymous){const r=await this.sb.auth.updateUser({email},{emailRedirectTo:redirect});if(!r.error)return;if(!/already|registered|exists/i.test(r.error.message||''))throw r.error;}
    const {error}=await this.sb.auth.signInWithOtp({email,options:{emailRedirectTo:redirect}});if(error)throw error;},
  linked(){return !!(this.user&&!this.user.is_anonymous);},
  async logout(){await this.sb.auth.signOut();this.user=null;this.meta=null;},
  async push(silent){
    if(!this.user)return false;save();
    const row={user_id:this.user.id,data:S,day:S.day,money:Math.round(S.money),updated_at:new Date().toISOString()};
    const {error}=await this.sb.from('saves').upsert(row);
    if(error){if(!silent)toast('☁️ La sauvegarde en ligne a échoué. Réessaie dans un instant.','bad');return false;}
    this.meta={day:row.day,money:row.money,updated_at:row.updated_at};if(!silent)toast('☁️ Partie enregistrée en ligne !','gold');return true;
  },
  async pull(){const {data,error}=await this.sb.from('saves').select('data,day,money,updated_at').eq('user_id',this.user.id).maybeSingle();if(error)throw error;return data;},
  async remove(){const {error}=await this.sb.from('saves').delete().eq('user_id',this.user.id);if(error)throw error;this.meta=null;},
  async fetchMeta(){try{const {data}=await this.sb.from('saves').select('day,money,updated_at').eq('user_id',this.user.id).maybeSingle();this.meta=data||null;}catch(e){}},
};
function cloudBoxHtml(){
  if(!Cloud.linked())return `<div class="cloud-box"><b>☁️ Sauvegarde en ligne</b><p class="small">Connecte-toi avec ton e-mail pour retrouver ta partie sur tous tes appareils. Pas de mot de passe : tu reçois un lien de connexion.${Cloud.user?' Ta vitrine du multijoueur reste attachée à ce compte.':''}</p><div class="cloud-row"><input type="email" id="cloudEmail" class="txt" placeholder="ton@email.fr" autocomplete="email" aria-label="Ton adresse e-mail"><button class="btn btn-primary" type="button" id="cloudLogin">Recevoir le lien</button></div></div>`;

function bindCloudBox(msg){
  const q=id=>document.getElementById(id);let armPull=false,armDel=false;
  const li=q('cloudLogin');if(li)li.addEventListener('click',async()=>{const em=(q('cloudEmail').value||'').trim();if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){msg.textContent='❌ Cette adresse e-mail ne semble pas valide.';return;}li.disabled=true;msg.textContent='Envoi du lien…';try{await Cloud.login(em);msg.textContent='📧 Lien envoyé ! Ouvre l’e-mail sur cet appareil et clique sur le lien pour te connecter.';}catch(e){msg.textContent='❌ Impossible d’envoyer le lien pour le moment. Réessaie dans quelques minutes.';li.disabled=false;}});
  const pu=q('cloudPush');if(pu)pu.addEventListener('click',async()=>{pu.disabled=true;msg.textContent='Envoi en cours…';const ok=await Cloud.push(true);msg.textContent=ok?'✅ Partie enregistrée en ligne.':'❌ La sauvegarde en ligne a échoué. Réessaie dans un instant.';pu.disabled=false;});
  const pl=q('cloudPull');if(pl)pl.addEventListener('click',async()=>{
    if(!armPull){const m=Cloud.meta;armPull=true;msg.textContent=`⚠️ Ta partie actuelle sera remplacée par ta partie en ligne (jour ${m?m.day:'?'}). Clique encore pour confirmer.`;return;}
    pl.disabled=true;try{const row=await Cloud.pull();if(!row||!row.data)throw 0;loadSave(row.data);closeModal();toast('☁️ Partie en ligne récupérée !','gold');confettiBurst(80);}catch(e){msg.textContent='❌ Impossible de récupérer la partie en ligne.';pl.disabled=false;armPull=false;}});
  const lo=q('cloudOut');if(lo)lo.addEventListener('click',async()=>{await Cloud.logout();closeModal();toast('Déconnecté de la sauvegarde en ligne.');});
  const de=q('cloudDel');if(de)de.addEventListener('click',async()=>{
    if(!armDel){armDel=true;msg.textContent='⚠️ Ta sauvegarde en ligne sera effacée définitivement (ta partie sur cet appareil est conservée). Clique encore pour confirmer.';return;}
    try{await Cloud.remove();closeModal();toast('Sauvegarde en ligne supprimée.');}catch(e){msg.textContent='❌ La suppression a échoué.';armDel=false;}});
}

let tutoI=-1,TS=[];
function startTuto(){
  closeModal();updateHud();
  TS=TUTO.filter(st=>{const el=document.querySelector(st.sel);return el&&!el.hidden&&el.getClientRects().length>0;});
  if(!TS.length)return;
  let o=$('#tuto');
  if(!o){
    o=document.createElement('div');o.id='tuto';
    o.innerHTML='<div class="tuto-hole"></div><div class="tuto-tip" role="dialog" aria-modal="true" aria-labelledby="tutoT" aria-describedby="tutoD"><p class="eyebrow" id="tutoN"></p><h3 id="tutoT"></h3><p id="tutoD"></p><div class="btns"><button type="button" class="btn btn-sm" data-tuto="prev">← Précédent</button><button type="button" class="btn btn-primary btn-sm" data-tuto="next">Suivant →</button></div><button type="button" class="tuto-skip" data-tuto="skip">Passer le tuto</button></div>';
    document.body.appendChild(o);
    o.addEventListener('click',e=>{const b=e.target.closest('[data-tuto]');if(!b||b.disabled)return;const a=b.dataset.tuto;if(a==='next')tutoGo(1);else if(a==='prev')tutoGo(-1);else endTuto(false);});
    window.addEventListener('resize',placeTuto);window.addEventListener('scroll',placeTuto,{passive:true});
    document.addEventListener('keydown',e=>{if(tutoI<0)return;if(e.key==='Escape')endTuto(false);else if(e.key==='ArrowRight')tutoGo(1);else if(e.key==='ArrowLeft')tutoGo(-1);});
  }
  o.hidden=false;const wasOff=tutoI<0;tutoI=0;showTuto();
  // Le cadre suit sa cible à chaque image (défilement, changement d'onglet, redimensionnement)
  if(wasOff){const loop=()=>{if(tutoI<0)return;placeTuto();requestAnimationFrame(loop);};requestAnimationFrame(loop);}

function showTuto(){
  const st=TS[tutoI];if(!st)return;
  if(st.tab&&tab!==st.tab){tab=st.tab;renderPanel();}
  const el=document.querySelector(st.sel);if(el)el.scrollIntoView({block:'center',behavior:reduceMotion?'auto':'smooth'});

  const last=tutoI===TS.length-1,prev=$('#tuto [data-tuto="prev"]'),next=$('#tuto [data-tuto="next"]');
  prev.disabled=tutoI===0;next.textContent=last?(st.open?'☀️ Ouvrir mon café':'✓ Terminer'):'Suivant →';
  placeTuto();setTimeout(placeTuto,420);setTimeout(()=>next.focus({preventScroll:true}),60);
}
function tutoGo(d){const n=tutoI+d;if(n<0)return;if(n>=TS.length)return endTuto(true);tutoI=n;showTuto();}
function placeTuto(){
  if(tutoI<0)return;const st=TS[tutoI],el=st&&document.querySelector(st.sel),o=$('#tuto');if(!el||!o)return;
  const r=el.getBoundingClientRect(),pad=6,hole=o.querySelector('.tuto-hole'),tip=o.querySelector('.tuto-tip');
  Object.assign(hole.style,{left:(r.left-pad)+'px',top:(r.top-pad)+'px',width:(r.width+pad*2)+'px',height:(r.height+pad*2)+'px'});
  const vw=innerWidth,vh=innerHeight,tw=Math.min(340,vw-32);tip.style.width=tw+'px';const th=tip.offsetHeight;
  let top=r.bottom+14;if(top+th>vh-12)top=r.top-th-14;if(top<12)top=Math.max(12,vh-th-16);
  tip.style.top=top+'px';tip.style.left=Math.max(16,Math.min(vw-tw-16,r.left+r.width/2-tw/2))+'px';
}
function endTuto(open){
  tutoI=-1;const o=$('#tuto');if(o)o.hidden=true;

function mpPaintVisit(el,p){
  const snap=p.snapshot||{},keepS=S,keepR=R;
  try{
    const items={};(snap.items||[]).forEach(id=>{if(ITEM[id])items[id]={unlocked:true};});
    S=mergeState({upg:snap.upg||{},items,staff:(Array.isArray(snap.staff)?snap.staff:[]).slice(0,4).map(look=>({look,name:'',trait:'calme',salary:0,days:0,morale:80})),
      flags:{art:!!snap.art},custom:Object.assign({},snap.custom||{}),weather:'soleil',firm:{created:true,name:p.firm_name,locations:[],createdDay:1}});
    R={phase:'open',time:DAY_LEN*.42,speed:1,customers:[],queue:[],stations:[],seats:[],coins:[],floaters:[],sparks:[],passers:[],doorOpen:0,t:keepR.t,truck:null,lateDelivery:null,warned:{},modalTok:keepR.modalTok,signText:p.firm_name};
    syncStations();syncSeats();
    const c=el.getContext('2d'),sc=el.width/W;c.setTransform(sc,0,0,sc,0,0);
    paintStatic(c);drawWindow(c);drawSign(c);drawDoor(c);drawWallDecor(c);drawBoard(c);drawShelves(c);drawTurntable(c);drawBackBar(c);
    R.stations.forEach((st,i)=>{const m=staffAt(i);drawPerson(c,STATION_X[i],STAFF_Y,m&&m.look?m.look:meLook(),{apron:true,working:false,mood:'happy',noShadow:true});});
    drawCounter(c);
    const ents=[];R.seats.forEach(s=>{if(!s.terrace)ents.push({y:s.y-.5,f:()=>drawChair(c,s)});});
    for(let i=0;i<Math.min(S.upg.tables,TABLES.length);i++){const t=TABLES[i];ents.push({y:t.y,f:()=>drawTable(c,t,i)});}
    ents.sort((a,b)=>a.y-b.y).forEach(e=>e.f());
    drawLights(c);
    return true;
  }catch(e){return false;}
  finally{S=keepS;R=keepR;}
}

const fx=$('#fx'),fctx=fx.getContext('2d');let confetti=[],fxOn=false;
function confettiBurst(n){
  if(reduceMotion)n=Math.min(n,20);
  const st=$('#stage').getBoundingClientRect();const x=st.left+st.width/2,y=st.top+st.height*.35;
  const cols=['#e2456b','#f0ad3c','#3f8f63','#4f7cc9','#fff3e0','#8b5cc7'];
  for(let i=0;i<n;i++)confetti.push({x,y,vx:rand(-8,8),vy:rand(-12,-3),g:rand(.22,.32),w:rand(5,9),h:rand(3,6),c:pick(cols),a:rand(0,TAU),va:rand(-.3,.3),life:rand(90,150)});

function stepConfetti(){
  if(!confetti.length){if(fxOn){fctx.clearRect(0,0,fx.width,fx.height);fxOn=false;}return;}
  fxOn=true;const d=Math.min(window.devicePixelRatio||1,2);
  if(fx.width!==Math.round(innerWidth*d)||fx.height!==Math.round(innerHeight*d)){fx.width=Math.round(innerWidth*d);fx.height=Math.round(innerHeight*d);}
  fctx.setTransform(d,0,0,d,0,0);fctx.clearRect(0,0,innerWidth,innerHeight);
  confetti.forEach(p=>{p.vy+=p.g;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.a+=p.va;p.life--;fctx.save();fctx.globalAlpha=clamp(p.life/40,0,1);fctx.translate(p.x,p.y);fctx.rotate(p.a);fctx.fillStyle=p.c;fctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);fctx.restore();});
  confetti=confetti.filter(p=>p.life>0&&p.y<innerHeight+40);
}

  openModal(`<div class="modal-head"><span class="modal-ic">${ev.icon}</span><div><p class="eyebrow">Ce soir au café</p><h2>${ev.title}</h2></div></div>
   <p class="ev-text">${ev.text}</p>
   <div class="choices">${choices.map((ch,i)=>`<button class="btn ${i===0?'btn-primary':''} btn-lg" data-choice="${i}" ${ch.c&&S.money<ch.c?'disabled':''}>${ch.label}${ch.c?` · −${costTxt(ch.c)}`:''}</button>`).join('')}</div>`,null,i=>{
    const ch=choices[i];if(!ch)return;if(ch.c){if(S.money<ch.c)return;S.money-=ch.c;book('evenements',-ch.c);if(ch.raw==null)S.ledger.invest+=ch.c;}
    const res=ch.fx?ch.fx():'';Snd.buy();saveSoon();
    openModal(`<div class="modal-head"><span class="modal-ic">${ev.icon}</span><div><p class="eyebrow">Ce soir au café</p><h2>${ev.title}</h2></div></div><p class="ev-text">${res||'C’est noté.'}</p><button class="btn btn-primary btn-lg" data-modal-ok>Continuer</button>`,next);if(autoOn())autoClick('[data-modal-ok]',2500);
  });
  if(autoOn()){const fi=choices.findIndex(ch=>!ch.c);autoClick(`[data-choice="${fi<0?choices.length-1:fi}"]`,6000);}
}

function spark(arr){
  if(!arr.length)return '<p class="muted small">Premier bilan ce soir.</p>';
  const w=220,h=34,mn=Math.min(0,...arr),mx=Math.max(1,...arr);const sy=v=>h-2-(v-mn)/(mx-mn)*(h-4);const y0=sy(0);const bw=w/14;

}
function financeChart(){
  const H2=S.history.slice(-14);if(!H2.length)return '<p class="muted small">Le graphique apparaîtra après ta première journée.</p>';
  const w=360,h=130,pl=40,pb=18,pt=8;const vals=H2.map(x=>x.profit);const mn=Math.min(0,...vals),mx=Math.max(1,...vals);
  const sy=v=>pt+(mx-v)/(mx-mn)*(h-pt-pb);const bw=(w-pl)/14;
  let s=`<svg class="fchart" viewBox="0 0 ${w} ${h}" role="img" aria-label="Bénéfice des ${H2.length} derniers jours">`;
  s+=`<line x1="${pl}" x2="${w}" y1="${sy(0).toFixed(1)}" y2="${sy(0).toFixed(1)}" class="ch-axis"/>`;
  s+=`<text x="${pl-6}" y="${(sy(mx)+4).toFixed(1)}" class="ch-txt" text-anchor="end">${fmtK(mx)} €</text><text x="${pl-6}" y="${(sy(0)+4).toFixed(1)}" class="ch-txt" text-anchor="end">0</text>`;
  if(mn<0)s+=`<text x="${pl-6}" y="${(sy(mn)+4).toFixed(1)}" class="ch-txt" text-anchor="end">−${fmtK(-mn)} €</text>`;
  H2.forEach((d,i)=>{const x=pl+i*bw+2,y=Math.min(sy(d.profit),sy(0)),hh=Math.max(1,Math.abs(sy(d.profit)-sy(0)));s+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${(bw-4).toFixed(1)}" height="${hh.toFixed(1)}" rx="2" class="${d.profit>=0?'ch-pos':'ch-neg'}"><title>Jour ${d.day} : ${d.profit>=0?'+':'−'}${eur(Math.abs(d.profit),0)}</title></rect>`;});
  s+=`<text x="${(pl+bw/2).toFixed(1)}" y="${h-4}" class="ch-txt" text-anchor="middle">J${H2[0].day}</text>`;
  if(H2.length>1)s+=`<text x="${(pl+(H2.length-1)*bw+bw/2).toFixed(1)}" y="${h-4}" class="ch-txt" text-anchor="middle">J${H2[H2.length-1].day}</text>`;
  return s+'</svg><p class="muted small">Bénéfice par jour, succursales comprises.</p>';
}
